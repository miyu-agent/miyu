# dsh 没有官方终端界面（审定 Q1）：量第三方的 dsh-tui（ccch1mneyyy/dsh-TUI，不是 DeepSeek 官方的）。它的说明书的装法是
# `npm i -g @deepseek-ai/dsh pnpm @deepseek-harness-tui/dsh-tui`：dsh-tui 只是个启动器，第一次跑用 `dsh plugin --profile dsh-tui add`
# （转给 pnpm）把同版本的自己装进 $DSH_HOME/profiles/dsh-tui，以后起的是 `dsh --profile dsh-tui`。三个都钉住（direct = 直接装的）。
[dsh]
name = "dsh（第三方 dsh-tui）"
packages = [
  { name = "@deepseek-harness-tui/dsh-tui", version = "0.18.0", direct = true, sha512 = "sha512-3LMtBYYR3uyW1mx4CsqS13w7k7+YJ7u6/DefpxySbftnyzJOLSKM4I/OYwIK5hvom0P2n2OPsHt7HI42ENbrgg==" },
  { name = "@deepseek-ai/dsh", version = "0.2.1-rc.5", direct = true, sha512 = "sha512-WkyJZv4zl9sCAxSzRctGm58m0rilGqwR6pniBiLOz5CPDfHfDuAUicg0AAazXI7oj/Cph6/cjNTncA/rpLTXpw==" },
  { name = "pnpm", version = "12.16.1", direct = true, sha512 = "sha512-CR0d7nknV1Zhsl2rPCrjHK/BxU1rce1qZgDPDByxBDSkR+rhQBXxsj4ua+3u1535SpMuIWTSgyKA3OP7MvZW0Q==" },
]
program = "dsh-tui/node_modules/@deepseek-harness-tui/dsh-tui/bin/dsh-tui.js"
# dsh-tui 照 PATH 找 dsh、pnpm：这两个目录放进 PATH。
path = ["dsh/node_modules/.bin", "pnpm/node_modules/.bin"]
sha256 = "69f63d668803c7b048310742da36a287a2d5abbc142b65b7430479caf5592b88"
runtime = "node"
