# 发版前对比（施工 BM-1）装的各家：版本冻结日 2026-11-05（当天 npm 的 latest）。`bm_install.py` 照这里装、装完逐个核对，
# 对不上就停。中途哪家出新版也不换。sha512 是 npm 的 integrity（包的压缩包），sha256 是装出来那个实际跑的程序，
# 2026-11-05 在 .91 上第一次装时实算后填进来。
#
# 装法（量法设计 1.1）：`npm install --prefix <out>/prefix/<家> --ignore-scripts --omit=dev`，npm 的缓存、配置都指进 <out>，
# 家目录是隔离的；直接跑平台包里的原生程序，不走 npm 的 node 包装。node 也钉一个 nodejs.org 的官方包。

frozen = "2026-11-05"

[node]
version = "v26.13.0"
url = "https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-x64.tar.xz"
# nodejs.org 的 SHASUMS256.txt 里这个文件的那一行。
sha256 = "d28a96af6c38596f6d9d97c0ee531c13d238d757742387d1928de822d959e997"

