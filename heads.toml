# 两个界面（设计 `32-仓库拆分.md` 第六节，施工 S-5）：它们的代码和清单在各自的仓库里，核心仓库只记取哪一份。
# 发版时照这里取：程序（三个平台各一份）放在 `miyu` 旁边，仓库里和编号同名的文件夹（`tui/`、`webui/`，设计 48；
# 2026-11-12 以前叫 `miyu-tui/`、`miyu-webui/`）放进资源目录的 `packages/<编号>/`。
# 网页另有页面：仓库 `web-demo/` 里的 index.html、distro.json、src、styles、packages、resources、vendor 七样放进
