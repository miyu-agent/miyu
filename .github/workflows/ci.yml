# 三平台 CI：每台机器跑 cargo xtask check，和本地验收是同一条命令；另有长跑、量尺两项，只在 Linux 上。
# 为什么这样定，见 docs/construction/0-3-三平台CI.md；2026-10-08 提速（缓存、长跑只编有长跑测试的两个 crate）见
# docs/construction/0-3-三平台CI（补）.md。
name: CI

on:
  push:
    branches: [main, "step/**"]
    # 只改了门禁不读的文档不跑（2026-10-16 项目主人同意，施工单 0-3 四补）：施工单、作者说明、评审、设计文档。门禁读的
    # 照跑：蓝图（样本块、提示词）、设计 01、23、26（层、性能预算、提示词登记簿）、docs/perf。后写的盖先写的。
    paths:
      - "**"
      - "!docs/construction/**"
      - "!docs/authors/**"
      - "!docs/reviews/**"
      - "!docs/designs/**"
      - "docs/designs/01-架构.md"
      - "docs/designs/23-性能预算.md"
      - "docs/designs/26-提示词.md"
  workflow_dispatch:

permissions:
  contents: read

# 每项最多跑 45 分钟（check 后来放到 60，施工 CI-1）：测试卡住时（例如会话 actor 的测试等一个不会来的回应），不白等 GitHub 默认的六个小时
# （施工 3-7 中）。原来是 30 分钟，2026-10-07 项目主人定改成 45：Windows 平时要 28、29 分钟，长跑 20 到 29 分钟，
# 几个分支同时排队时卡在线上被取消。
jobs:
  # main 上的这个提交在分支上已经整套跑绿过（照 main 快进合的，同一个 sha）：下面三项缓存正好命中的就不再跑一遍，只在缓存
  # 没命中时照跑，顺带把这一份缓存存上（只有 main 存缓存，分支照它取）。别的分支、手动跑的照旧全跑。
  tested:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      already: ${{ steps.look.outputs.already }}
    steps:
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          already=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&status=success&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "CI" and .head_branch != "main")] | length')
            [ "${n:-0}" -gt 0 ] && already=true
          fi
          echo "already=$already" >> "$GITHUB_OUTPUT"
          echo "这个提交在分支上已经测过：$already"

  check:
    needs: tested
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Linux 钉 24.04：发行构建以 glibc 2.39 为基线（12-进程形态与分发 R11）。
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # 测试程序只留行号（施工 CI-3）：调试信息是编测试、链接、占盘的大头，Windows 上生成 PDB 尤其慢；panic 的回溯照样有
      # 文件和行号，只是调试器里看不了变量。只在 check：randomized 照 release 编，perf 里照 dev 编的只有 xtask 自己。
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # 「clippy（核心不开可选包）」只在 ubuntu 跑（施工 CI-3）：它查的是特性组合，和平台关系不大，Windows、macOS 上省一遍
      # 编核心。空的等于没设，门禁照跑；本机门禁不设，照旧全跑。
      MIYU_CHECK_SKIP_BARE_CORE: ${{ !startsWith(matrix.os, 'ubuntu') && '1' || '' }}
    steps:
      # Windows 上把工作目录、~/.cargo、临时目录加进 Defender 的排除（施工 CI-3）：编译、建文件多的测试每开一个文件都要
      # 过一遍实时扫描。不关实时扫描，只加排除；托管机器上加不上就打一行原因往下走，不让 CI 红。
      - name: Defender 排除工作目录
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", $env:CARGO_HOME, $env:TEMP, $env:RUNNER_TEMP) |
            Where-Object { $_ } | Sort-Object -Unique
          try { Add-MpPreference -ExclusionPath $paths -ErrorAction Stop; "加了：$($paths -join '; ')" }
          catch { "加不上：$_" }
          try {
            $status = Get-MpComputerStatus -ErrorAction Stop
            "实时扫描：$($status.RealTimeProtectionEnabled)"
            "排除：$((Get-MpPreference -ErrorAction Stop).ExclusionPath -join '; ')"
          }
          catch { "读不到 Defender 的设置：$_" }
      # 腾出盘（施工 CI-2）：GitHub 托管的 ubuntu 机器的盘被编译缓存加 debug 的测试程序吃满过（runner 报
      # 「No space left on device」，门禁开头就死）。删掉用不上的 .NET、Android SDK、GHC、CodeQL，删前删后各打一行 `df -h`。
      - name: 腾出盘
        if: runner.os == 'Linux'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - uses: actions/checkout@v7
      # 机器自带的别的工具链卸掉（施工 CI-3）：取缓存时键里算的是装着的每一个工具链的版本，GitHub 的机器自带的 stable 一批
      # 一批地换（同一天有 1.98.1 的、有 1.99.0 的，0-3 再补撞见过），留着它分支就对不上 main 存的那一份，连按前缀退回都退不到。
      - name: 装上 rust-toolchain.toml 钉住的工具链
        shell: bash
        run: |
          rustup toolchain install
          pinned=$(rustup show active-toolchain | cut -d' ' -f1)
          rustup toolchain list | cut -d' ' -f1 | while read -r other; do
            [ "$other" = "$pinned" ] || rustup toolchain uninstall "$other" || true
          done
          rustup toolchain list
      # 第三方依赖的编译产物：照 Cargo.lock、工具链、这台机器的系统分开存；只有 main 上的那一次存，分支照 main 的取，
      # 缓存不随分支越攒越多。工作区自己的 crate 每次照旧编。
      # 键照 rust-cache 默认的那一套（施工 CI-3，core1 11-05 定）：前一半是项名、系统、工具链的版本和 CARGO_ 等开头的环境
      # 变量，后一半是 Cargo.lock 和各个 Cargo.toml 的哈希。原来关了它（0-3 再补，`add-rust-environment-hash-key: false`），
      # 这个开关把后一半也一起关了，键里只剩项名和系统；GitHub 的缓存一个键只能存一次，键不变就再也不存新的，main 一直命中
      # 10-10 存的那一份。现在改了 Cargo.lock 的，按前一半退回到最近的一份，只重编变了的依赖，跑完照新键存一份。
      # 另加 dev-lines：只留行号的标记，环境变量本来就算在前一半里，写明了好认。
      - name: 取编译缓存
        id: cache
        uses: Swatinem/rust-cache@v2
        with:
          key: dev-lines
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 门禁
        if: needs.tested.outputs.already != 'true' || steps.cache.outputs.cache-hit != 'true'
        run: cargo xtask check

  # 长跑：随机测试接着平时的往后跑两万例（照 niri 的 randomized-tests，施工 2-10）。平时的
  # cargo test 和本地门禁跳过这几个 #[ignore] 的测试；纯逻辑不碰平台，只在 Linux 上、release 模式跑。
  # 只编有长跑测试的 crate、只跑名字以 for_longer 结尾的（2026-10-08）：原来 release 编整个工作区要 38 分钟，
  # 测试本身不到 2 分钟；别的 #[ignore] 是量尺、要外网、要虚拟机的，在这里跑了也白跑。新加长跑测试照这个名字、
  # 放在别的 crate 里的，把 crate 加进下面的 CRATES。
  # 新旧对照的全量也在这一项跑（施工 CI-2，docs/construction/CI-2-测试分流.md）：check 里只跑够快的几份种子。
  randomized:
    needs: tested
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    # 查对错，不量快慢：不用 release 的整体优化（施工 V-5 下），省下编的时间；断言、溢出检查照 debug 开着（施工 CI-2：对照
    # 全量比的和 check 里 debug 比的一样，溢出、debug_assert 照样拦）。放在整项上：下面两步编的是同一份。
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
      # 有长跑、有对照全量测试的 crate：只编它们的库和 tests/all.rs。新加的放在别的 crate 里的，把 crate 加进这一行。
      CRATES: -p miyu-kernel -p miyu-assemble -p miyu-endpoint -p miyu-session -p miyu-basesystem -p miyu-drivers -p miyu-sandbox
    steps:
      # 腾出盘（施工 CI-2）：同 check。
      - name: 腾出盘
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - uses: actions/checkout@v7
      # 别的工具链卸掉（施工 CI-3）：同 check。
      - name: 装上 rust-toolchain.toml 钉住的工具链
        shell: bash
        run: |
          rustup toolchain install
          pinned=$(rustup show active-toolchain | cut -d' ' -f1)
          rustup toolchain list | cut -d' ' -f1 | while read -r other; do
            [ "$other" = "$pinned" ] || rustup toolchain uninstall "$other" || true
          done
          rustup toolchain list
      - name: 取编译缓存
        id: cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 长跑
        if: needs.tested.outputs.already != 'true' || steps.cache.outputs.cache-hit != 'true'
        run: cargo test --release --no-fail-fast $CRATES --lib --test all -- --ignored for_longer
      # 新旧对照的全量（施工 CI-2）：check 里这些测试只跑够快的几份种子（照 Windows debug 的时长定），全量在这里照环境变量开，
      # 比的东西和 check 里的一样，只是种子多。新加的对照测试照这个样子：默认少跑、环境变量全量，开关和名字加到下面两处。
      # 纯逻辑的层（miyu-kernel、miyu-assemble）不读环境变量：全量写成名字以 for_longer 结尾的 #[ignore] 测试，上一步跑。
      - name: 对照全量
        if: needs.tested.outputs.already != 'true' || steps.cache.outputs.cache-hit != 'true'
        env:
          MIYU_ASKED_FULL: "1"
          MIYU_HANDED_FULL: "1"
          MIYU_HISTORY_FULL: "1"
          MIYU_MEMO_SEEDS: "1000"
          MIYU_PAGES_FULL: "1"
          MIYU_RECORDS_FULL: "1"
          MIYU_UNDO_SEEDS: "5000"
          MIYU_V43_SEEDS: "2400"
          MIYU_V46_SEEDS: "50000"
          MIYU_V47_SEEDS: "5000"
        run: >-
          cargo test --release --no-fail-fast $CRATES --lib --test all --
          asked::tests::the_same_as_the_whole_read_over_seeded_sessions
          undo::tests::same::
          venues::records::tests::
          view::read::tests::same::
          store::tests::seen::
          actor::extract::planned::tests::swept::
          fork_streamed::handed::
          history::tests::same
          memo::
          linux::reads::tests::same::
          linux::cache::tests::same::

  # 量尺（施工 V-3，23 F4）：照 23 第二节的预算量核心这一边，表贴进这一次跑的摘要和日志。只在 Linux 上：预算照 Linux 定的。
  # 不等会话闲够了退下（--idle-wait 0）：那一项没有预算，等它要多三分多钟。闸门：时间、内存超过预算本身就红（施工 V-5 下，以前时间放到 1.5 倍）
  # （倍数照这台机器实测定，见 docs/blueprint/perf.md「闸门」）。
  perf:
    needs: tested
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      # 腾出盘（施工 CI-2）：同 check。
      - name: 腾出盘
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - uses: actions/checkout@v7
      # 别的工具链卸掉（施工 CI-3）：同 check。
      - name: 装上 rust-toolchain.toml 钉住的工具链
        shell: bash
        run: |
          rustup toolchain install
          pinned=$(rustup show active-toolchain | cut -d' ' -f1)
          rustup toolchain list | cut -d' ' -f1 | while read -r other; do
            [ "$other" = "$pinned" ] || rustup toolchain uninstall "$other" || true
          done
          rustup toolchain list
      - name: 取编译缓存
        id: cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # 三家对比的测具（施工 V-7）本身要真模型、要别家的程序，发版前人跑；这里只跑它不用别家就能查的几条：表写得对、占位都认识、汇表。
      - name: 三家对比的测具
        if: needs.tested.outputs.already != 'true' || steps.cache.outputs.cache-hit != 'true'
        run: python3 -m unittest discover -s bench/rivals -p 'test_*.py'
      - name: 量尺
        if: needs.tested.outputs.already != 'true' || steps.cache.outputs.cache-hit != 'true'
        run: cargo xtask perf --idle-wait 0 --gate 1 --out "$GITHUB_WORKSPACE/target/perf-out"
      - name: 表贴进摘要
        if: always() && (needs.tested.outputs.already != 'true' || steps.cache.outputs.cache-hit != 'true')
        run: cat "$GITHUB_WORKSPACE"/target/perf-out/*.md | tee -a "$GITHUB_STEP_SUMMARY" || true
      # 原始数据留下（施工 V-14）：表里只有分位，查尾巴是哪几轮冒尖、跟着什么，要看每一次的数。
      - name: 原始数据
        if: always() && (needs.tested.outputs.already != 'true' || steps.cache.outputs.cache-hit != 'true')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: perf-raw
          path: target/perf-out/*.json
          if-no-files-found: ignore
