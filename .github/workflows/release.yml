# 发版（施工 RL-2，设计 59 第三、四、五节）：推 `v<版本>` 标签（版本是 Cargo.toml 的 [workspace.package] version；演练用
# `v<版本>-rc.N` 的预发布标签，编之前在 CI 机器上把工作区版本临时改成标签里的版本，RL-2补2）时，四种系统各在自己的机器上
# `cargo xtask dist` 打包、`cargo xtask dist-check` 逐个查包（一体的一份；Linux 两种和 macOS 另有给系统源的三份：核心、
# 终端、网页，施工 SD-2），查不过的这一趟不发；十三个都过了，写 SHA256SUMS、用发版钥匙签、验，加构建出处证明，建一个**草稿** Release 把这些传上去。
# 发不发由项目主人看过草稿以后自己点（公开发布要主人当面同意），这里不发布。
#
# 要主人自己配的两样（施工单 RL-2「要什么」）：
#   - 密钥 MIYU_RELEASE_KEY：发版钥匙的私钥（`miyu-index keygen` 生成的 PKCS#8 base64），不经任何会话；
#   - 变量 MIYU_RELEASE_PUBLIC：同一把的公钥（base64），签完照它验一遍。
# 少了哪一样，签名那一步报错停下，不建 Release：不跳过签名。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  dist:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-latest
            target: macos-aarch64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: 标签和版本对得上
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          tag="$GITHUB_REF_NAME"
          case "${tag}" in
            "v${version}") ;;
            "v${version}"-rc.[0-9]*) ;;
            *) echo "::error::标签 ${tag} 和 Cargo.toml 的版本 ${version} 对不上（要 v${version} 或者 v${version}-rc.N）"; exit 1;;
          esac
          # 版本号是 年.月.这个月第几版（设计 59 第十节，2026-11-06 项目主人定）：年四位，月 1 到 12，月、序号不补零。
          # 写错了停下：工作区的版本要先用 `cargo xtask version <年.月.序号>` 定好（演练也是），这条正则同 xtask/src/version.rs。
          if ! [[ "${version}" =~ ^[1-9][0-9]{3}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Cargo.toml 的版本 ${version} 不是 年.月.序号（例如 2026.11.0，月、序号不补零）：先用 cargo xtask version 定号"
            exit 1
          fi
          echo "标签 ${tag}，版本 ${version}"
      - name: 装上 rust-toolchain.toml 钉住的工具链
        run: rustup toolchain install
      # 演练标签（v<版本>-rc.N）：只在这台机器上把工作区版本改成标签里的版本，不提交（施工 RL-2补2）。压缩包照它起名、包里的
      # 程序照它报版本，`miyu upgrade` 照标签找得到、核得上，演练走的就是正式版的路子。Cargo.lock 里工作区自己那几个 crate 也记着
      # 版本，改完跑一次 `cargo metadata` 把它跟着刷新，后面带 --locked 的编译才不拒。正式标签 v<版本> 这一步什么都不动。
      # 两个头由下一步的 `cargo xtask dist` 照这里改好的版本对：演练号的头也临时盖成它，正式号的要一样（施工 RL-6）。
      - name: 演练标签用标签里的版本
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          tag="${GITHUB_REF_NAME}"
          if [ "${tag}" = "v${version}" ]; then
            echo "正式标签：版本照 Cargo.toml 的 ${version}"
            exit 0
          fi
          wanted="${tag#v}"
          echo "演练标签：工作区版本临时改成 ${wanted}（只在这台机器上，不提交）"
          # -i 后面紧跟后缀：GNU、BSD（macOS）的 sed 都认这种写法。
          sed -i.orig '/^\[workspace\.package\]/,/^\[/s/^version = ".*"$/version = "'"${wanted}"'"/' Cargo.toml
          rm Cargo.toml.orig
          now=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          [ "${now}" = "${wanted}" ] || { echo "::error::工作区版本没改成 ${wanted}，现在是 ${now}"; exit 1; }
          cargo metadata --format-version 1 > /dev/null
      # 放在默认的 target/dist/：相对仓库的路径在 Windows 的 bash 里也照常通配（$RUNNER_TEMP 在那边带反斜杠）。
      - name: 打包
        run: cargo xtask dist --target "${{ matrix.target }}"
      # Windows 只有一体的一份；别的系统一体的加系统源的三份（施工 SD-2）。头那一份查的时候要用旁边核心那一份，都在 target/dist/。
      - name: 查包
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=(target/dist/{miyu,tui,webui}-*-"${{ matrix.target }}".tar.gz target/dist/miyu-*-"${{ matrix.target }}".zip)
          case "${{ matrix.target }}" in windows-*) want=1 ;; *) want=4 ;; esac
          [ "${#found[@]}" -eq "${want}" ] || { echo "::error::target/dist/ 里该有 ${want} 个压缩包，有 ${#found[@]} 个：${found[*]}"; exit 1; }
          for archive in "${found[@]}"; do
            cargo xtask dist-check "${archive}"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: |
            target/dist/miyu-*-${{ matrix.target }}.tar.gz
            target/dist/tui-*-${{ matrix.target }}.tar.gz
            target/dist/webui-*-${{ matrix.target }}.tar.gz
            target/dist/miyu-*-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: dist
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          ls -1 miyu-*.tar.gz tui-*.tar.gz webui-*.tar.gz miyu-*.zip | sort > files
          [ "$(wc -l < files)" -eq 13 ] || { echo "::error::要十三个压缩包（四个一体的，三种系统各三份分包），拿到的是：$(tr '\n' ' ' < files)"; exit 1; }
          xargs sha256sum < files > SHA256SUMS
          rm files
          cat SHA256SUMS
      - name: 装上 rust-toolchain.toml 钉住的工具链
        run: rustup toolchain install
      - name: 签名（发版钥匙）
        env:
          MIYU_INDEX_KEY: ${{ secrets.MIYU_RELEASE_KEY }}
          RELEASE_PUBLIC: ${{ vars.MIYU_RELEASE_PUBLIC }}
        run: |
          set -euo pipefail
          if [ -z "${MIYU_INDEX_KEY:-}" ]; then
            echo "::error::没有密钥 MIYU_RELEASE_KEY：发版钥匙由项目主人生成、放进这个仓库的 Actions secret（施工单 RL-2）。不签不发。"
            exit 1
          fi
          if [ -z "${RELEASE_PUBLIC:-}" ]; then
            echo "::error::没有变量 MIYU_RELEASE_PUBLIC：发版钥匙的公钥（base64），签完照它验。不验不发。"
            exit 1
          fi
          cargo build --quiet --locked -p miyu-source --bin miyu-index
          target/debug/miyu-index sign-sums dist/SHA256SUMS
          target/debug/miyu-index verify-sums dist/SHA256SUMS --public "$RELEASE_PUBLIC"
      - name: 构建出处证明
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/miyu-*.tar.gz
            dist/tui-*.tar.gz
            dist/webui-*.tar.gz
            dist/miyu-*.zip
            dist/SHA256SUMS
      - name: 草稿 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          files=(dist/miyu-*.tar.gz dist/tui-*.tar.gz dist/webui-*.tar.gz dist/miyu-*.zip dist/SHA256SUMS dist/SHA256SUMS.sig)
          prerelease=()
          case "$tag" in *-rc.*) prerelease=(--prerelease);; esac
          {
            echo "草稿：${tag}（打包的提交 ${GITHUB_SHA}）。"
            echo
            echo "核对：\`sha256sum -c SHA256SUMS\`；SHA256SUMS 的签名在 SHA256SUMS.sig（Ed25519，发版钥匙）；"
            echo "构建出处：\`gh attestation verify <文件> -R $GITHUB_REPOSITORY\`。"
            echo "装用 \`miyu-<版本>-<系统>\`（一体的）；\`miyu-core-*\`、\`tui-*\`、\`webui-*\` 是给系统源（AUR、Homebrew）打包用的分包。"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md
          if state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" != "true" ]; then
              echo "::error::$tag 的 Release 已经发布了，不覆盖"
              exit 1
            fi
            gh release edit "$tag" --notes-file notes.md "${prerelease[@]}"
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" --draft --verify-tag --title "Miyu $tag" --notes-file notes.md "${prerelease[@]}" "${files[@]}"
          fi
