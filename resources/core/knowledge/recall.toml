# 知识库自动想起照意思那一路的门槛（施工 K-6 下，`docs/blueprint/knowledge.md` 第九条）：照模型，人说的话和一段的相似度（点积，
# -1 到 1）不到门槛的不带；写法同记忆联想的那一张（`core/memory/recall.toml`）。表里没有的模型只走标题名那一路：没量过的
# 不知道多像才算像。数据，不给模型看，不进登记簿。
#
# bge-small-zh-v1.5 的 0.60 是 2026-10-13 在知识库的测评集（`docs/blueprint/knowledge/eval.md`）上量的：平常的话最像的那一段
# 0.36 到 0.49，一句都不带；标题名加 0.60 带的 94% 对，88% 的回合想起了该想的（项目主人同一天定）。
#
# granite-embedding-97m-multilingual-r2 的 0.86 是 2026-10-18 换出厂模型时在同一个测评集上量的（施工 R-5 七补）：平常的话最像的
# 那一段 0.74 到 0.81，一句都不带；标题名加 0.86 带的 89% 对，88% 的回合想起了该想的，和 bge 0.60 最接近。

