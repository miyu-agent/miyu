# 联想的门槛（施工 R-8，`docs/blueprint/memory.md` 第四条）：照模型，这一轮人说的话照关键词搜到的前 10 条里（施工 R-14 补起照
# 混合：两路都对上才带），和这句话的相似度（点积，-1 到 1）不到门槛的不带。模型照照意思找的那一路的写法：本机的 `local:<id>`，远程的 `<供应商>/<模型>`。表里没有的模型不联想：没量过的不知道
# 多像才算像，宁可不带（2026-10-10 项目主人定联想要「严」）。数据，不给模型看，不进登记簿。
#
# bge-small-zh-v1.5 的 0.60 是 2026-10-10 在测评集（`docs/blueprint/memory/eval.md`）上量的：平常的话最像的那一条在 0.43
# 到 0.60 之间，0.60 起一句都不误带，带了的七成多正是该带的。换模型、加远程的，照同一个测评集量了再写。
#
# granite-embedding-97m-multilingual-r2 的 0.84 是 2026-10-19 照混合量的（施工 R-14 补）：测评集上平常的话一句都不带，带了的里
# 57% 是该带的；项目主人旧版的真记忆（200 句、判过的）上乱带一成、带了的里该带的 52%（照纯向量的 0.85 是 19%、44%）。换出厂
# 模型时照纯向量量的是 0.85（施工 R-5 七补）。bge 的 0.60 是纯向量时量的，照混合只有更严，不动。

[thresholds]
"local:bge-small-zh-v1.5" = 0.60
"local:granite-embedding-97m-multilingual-r2" = 0.84
