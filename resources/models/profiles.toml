# 认得出的供应商的档案（docs/blueprint/models.md「在哪」，施工 8-6）：配置里写了这一家（或者 catalog 指着它），没写的
# 驱动、地址、开关照这里推。只给实测过的开（05-内核接口.md 第七节）。

# 目录里的 AI SDK 包名 → 驱动（施工 8-7）：档案没有的一家，照它对上的目录里那一家的 npm 推驱动、照 api 推地址。这里没列的
# 包（Google 这些）推不出驱动。
[npm]
"@ai-sdk/openai-compatible" = "openai-chat"
"@ai-sdk/anthropic" = "anthropic"
"@ai-sdk/openai" = "openai-responses"

# DeepSeek 官方：每条 assistant 都带 reasoning_content，没有就发空串；接着写用 prefix: true，发到 /beta/chat/completions
# （2026-09-27 实测）。一张图照官方计算器的算法算；收不收图照模型资料（目录里 deepseek-flash 收图，施工 8-7 起）。
# 思考的开关（施工 8-18）：thinking 写 {"type": "enabled"} 或 {"type": "disabled"}（2026-10-01 主会话在开发端点实测：disabled 时
# 思考 token 是 0）。有了它，目录里有 toggle 的模型多一档 off，只有开关的是 off、on。
# 余额（施工 QU-2）：GET 这个地址，头带 `Authorization: Bearer <key>`，回能不能用和每种币的余额（官方文档
# https://api-docs.deepseek.com/api/get-user-balance）。只在供应商的地址是官方的时候查：经中转站跑 DeepSeek 的、地址是环境变量
# 引用的不查，配置 [providers.<id>.quota] 改了地址也一样。
[providers.deepseek]
driver = "openai-chat"
base_url = "https://api.deepseek.com"
image_tokens = "deepseek"
compat = { reasoning = { replay = "reasoning_content", always = true }, continuation = { field = "prefix", path = "/beta/chat/completions" }, toggle = { field = "thinking", on = { type = "enabled" }, off = { type = "disabled" } } }
quota = { url = "https://api.deepseek.com/user/balance", format = "deepseek-balance" }
# 官方 Responses 接口自带的联网工具（设计 72、施工 DSR-3）：「联网服务」选中 deepseek-responses，并且这一家在官方地址上、模型走
# openai-responses、思考没有关闭时，Miyu 的 web_search 换成 deepseek_web_search 这一件声明，接在工具面末尾；web_fetch 留着。
# 不声明 deepseek_read_url（施工 DSR-4）：它不能和普通工具一起用，声明了它、提问里又带网址时，两件联网工具服务端都不执行
# （2026-11-19 实测）。指定的网址由 Miyu 的 web_fetch 读，深度搜索自己也会打开网页。
# effort：声明了它、这一次又没有定思考强度时，请求里明着写这一档。DeepSeek 默认就是 high，可是普通工具和联网工具一起声明时不明着
# 写，服务端不会真去搜索（2026-11-19 实测）。
search = { setting = "deepseek-responses", driver = "openai-responses", effort = "high", replaces = [["web_search", "deepseek_web_search"]] }

# Ollama 本机的服务（施工 8-11）：目录里没有（目录里的 ollama-cloud 是云端的），只为第一次接入找现成的本机服务。
[providers.ollama]
name = "Ollama"
driver = "openai-chat"
base_url = "http://127.0.0.1:11434/v1"

# Anthropic 官方（施工 8-12）：目录里这一家没写地址，档案补上。驱动的写法只有一套，没有开关；思考的开关是接口自带的。
[providers.anthropic]
driver = "anthropic"
base_url = "https://api.anthropic.com/v1"

# OpenRouter（施工 8-11 再补）：目录里这一家的包是它自己的（@openrouter/ai-sdk-provider），[npm] 推不出驱动；接口是 OpenAI 兼容的
# chat completions，地址照目录。只写驱动，没有开关（没有 key 实测过；列模型不要 key，2026-10-08 试过是通的）。常用的几家要它能用。
[providers.openrouter]
driver = "openai-chat"

# OpenAI 官方（施工 8-13）：目录里这一家没写地址，档案补上。Responses 接口，没有开关；思考强度照目录的档位。
[providers.openai]
driver = "openai-responses"
base_url = "https://api.openai.com/v1"

# opencode Console Go（施工 8-14）：驱动、地址照目录（模型各自写着包名：Claude、MiniMax 这几个走 anthropic，GPT、Grok 走
# openai-responses，别的走 openai-chat）。地址（施工 GO-1）：2026-11 起按协议分路径，https://opencode.ai/inference/go/openai/v1、
# …/anthropic/v1，目录每个模型写着自己那条，照它发；出厂快照还是旧的 https://opencode.ai/zen/go/v1（2026-11-17 还答）。缺 x-opencode-session 回 400 MissingSessionID（2026-10-03 实测）；
# 官方文档写明给第三方 agent 用：用自己的 User-Agent，每段对话发一个稳定的 x-opencode-session。值里的 {session_digest} 照种子
# （会话编号、一次性调用的用途）换成 opencode 会话编号的样子：前 12 位是时间的倒序编法，后 14 位是 SHA-256 的十六进制。
#
# 额度（施工 QU-1）：GET 这个地址，头带 `Authorization: Bearer <key>`，回 5 小时滚动、每周、每月三个窗口用了百分之几、什么时候重置
# （2026-11-14 实测 200；官方文档没写这个接口，旧地址 /zen/go/v1/usage 也还能用）。挪了地址的在配置 [providers.<id>.quota] 写 url。
[providers.opencode-go]
headers = { "x-opencode-session" = "ses_{session_digest}" }
quota = { url = "https://opencode.ai/inference/go/v1/usage", format = "opencode-go" }

# opencode Zen（施工 8-14 补，2026-10-04 实测；2026-10-13 再测）：免费档按客户端识别，几件同时成立——User-Agent 要是
# opencode/<版本≥1.18> 的形状、请求带至少一个 x-opencode-* 头、x-opencode-session 的前 12 位是 opencode 那种倒序的时间编号
# （10-13 起查：哈希出来的乱码、正序的一律 403，时间新旧不管；{session_digest} 照这个编）、工具面里有 shell 和 read；
# 还要求流式。头只发给这一家（目录里的地址是 https://opencode.ai/zen/v1）。User-Agent 盖掉客户端的 miyu/<版本>，这里写的是
# 本机装的 opencode 版本（2.0.21）；opencode 升级或被闸改判据时，先跑旧版 `miyu-agent` 仓库里的测具
# `testkit/opencode-zen/freetier_probe.js` 再动这一行。占位工具见「八、opencode Zen」第 2 条。
#
# 地址钉在旧的 /zen/v1（施工 GO-1，核心主会话 2026-11-17 定）：新目录里这一家是 https://opencode.ai/inference/openai/v1、每个
# 模型另写自己那条；免费档在新地址上认不认没实测出来（新旧地址不带 key 都回 429 FreeUsageLimitError，出不了字），实测出字以前
# 不跟着走。档案写了地址，模型自己的地址就不换（Go 没写，照模型的走）。
[providers.opencode]
base_url = "https://opencode.ai/zen/v1"
headers = { "User-Agent" = "opencode/2.0.21", "x-opencode-client" = "cli", "x-opencode-project" = "global", "x-opencode-session" = "ses_{session_digest}" }
placeholder_tools = ["read", "shell"]
