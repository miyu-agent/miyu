# 极简开发（施工 P-16 上，2026-10-23 项目主人定）：只给 shell 和读写文件的四件，让 AI 照它原来会的做。
# 不写 [software] basesystem：施工 BS-1 上中起基础系统拆成一件一个包（设计 44），这里只开读、写、改、运行命令四个包，没写的照
# unlisted 关着，基础系统组以后新加的包在这里也是关的。
[preset]
name = { zh = "极简开发", en = "Minimal", ja = "ミニマル開発" }
# 说明：给人看的，不发给模型。
summary = { zh = "只提供Shell和读写文件的工具，最小化工具集以最大程度发挥 AI 原有的能力。", en = "Only the shell and the file read and write tools: the smallest tool set, so the AI works the way it already knows.", ja = "シェルとファイルの読み書きだけ。道具を最小にして、AI 本来の力をそのまま生かします。" }
# 图标（施工 P-5 的写法）：一个终端窗口，和常规开发、全部功能的 box、boxes 一组。
icon = "square-terminal"
unlisted = "off"

[software]
miyu-base-read = true
miyu-base-write = true
miyu-base-edit = true
miyu-base-shell = true

[features]
# 环境那几块（施工 C-11；施工 ENV-1 起在内置包 env 里，编号不变）：极简开发照旧全开，和拆开以前一样；「用户身份」是原来的「关于你」，
# 原来就拼。
env-time = true
env-workdir = true
env-permission = true
env-session = true
env-model = true
env-harness = true
env-machine = true
env-profile = true
