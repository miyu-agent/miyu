# 常规开发（施工 P-2 上，`16-人格与预设.md` 第八节、Y7，`10-自带软件.md` 第四节；原来叫「开发」，施工 P-4 下改名「基础功能」、不写说明，2026-10-20 项目主人改名「常规开发」、打开记忆，施工 P-15）：写代码常用的。预设不再管默认人格（施工 P-4 上）。
[preset]
name = { zh = "常规开发", en = "Development", ja = "開発" }
# 说明（施工 P-16 上，2026-10-23 项目主人定）：给人看的，不发给模型。
summary = { zh = "在极简开发的基础上增加记忆、网络搜索、子代理、Agent间交流等开发常用工具。", en = "Minimal plus the tools development often needs: memory, web search, subagents, talking to other agents.", ja = "ミニマル開発に、記憶、ウェブ検索、サブエージェント、エージェント間の会話など開発でよく使う道具を加えたもの。" }
# 图标（施工 P-5）：和全部功能的 boxes 是一对，网页的会话 2026-10-10 挑的。
icon = "box"
unlisted = "off"

[software]
basesystem = true
# 注入环境信息（施工 ENV-1）：环境那几块和「关于你」原来跟着基础系统开，挪进 env 包以后照旧开着。
env = true
net = true
goal = true
# 定时任务、循环（施工 J-2，2026-10-26 项目主人定）：常规开发开着。
schedule = true
loop = true
# 人格记忆（施工 P-15，2026-10-20 项目主人定）。
memory = true
# 写技能、写包的两个技能（施工 P-8，2026-10-12 项目主人照推荐定）：不开的话她要写技能时看不到，只能在本机的目录里翻。
authoring = true
