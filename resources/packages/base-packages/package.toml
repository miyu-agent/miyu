# 基础系统组的一个包（施工 BS-1 上中，设计 44）：内置包，代码编在核心里，默认装、能关能卸。给人看的字，不发给模型。

[package]
author = "miyu-agent"
upstream = "https://github.com/miyu-agent/miyu"
prefix = "packages"
protocol = [1, 1]
groups = ["basesystem"]
name = { en = "Packages", zh = "软件包", ja = "パッケージ" }
summary = { en = "Look up and install packages", zh = "查看、安装软件包", ja = "パッケージを調べてインストールします" }

# 一个功能，编号同包（施工 BS-1 上中）：写明带的工具，装别的包时照它查工具撞名（`miyu_store::packages::conflicts`）。
[features.packages]
name = { en = "Packages", zh = "软件包", ja = "パッケージ" }
summary = { en = "Look up and install packages", zh = "查看、安装软件包", ja = "パッケージを調べてインストールします" }
tools = ["packages", "package"]

[builtin]
