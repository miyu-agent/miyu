# 基础系统组的一个包（施工 BS-1 上中，设计 44）：内置包，代码编在核心里，默认装、能关能卸。给人看的字，不发给模型。

[package]
author = "miyu-agent"
upstream = "https://github.com/miyu-agent/miyu"
prefix = "subagent"
protocol = [1, 1]
groups = ["basesystem"]
name = { en = "Subagents", zh = "子代理", ja = "サブエージェント" }
summary = { en = "Send work to a subagent with its own context", zh = "把活派给另开上下文的子代理", ja = "別のコンテキストのサブエージェントに仕事を任せます" }

# 一个功能，编号同包（施工 BS-1 上中）：写明带的工具，装别的包时照它查工具撞名（`miyu_store::packages::conflicts`）。
[features.subagent]
name = { en = "Subagents", zh = "子代理", ja = "サブエージェント" }
summary = { en = "Send work to a subagent with its own context", zh = "把活派给另开上下文的子代理", ja = "別のコンテキストのサブエージェントに仕事を任せます" }
tools = ["subagent"]

