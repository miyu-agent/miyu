# 循环任务（施工 J-2，设计 45 第三节第 4 条、第 6 条；施工 FG-1 改名）：任务和定时组的一个包（施工 FG-1 从基础系统组挪来，设计 52 第一节），内置，代码编在核心里，默认装、能关能卸。工具
# `schedule_wakeup`、斜杠命令 `/loop`。给人看的字，不发给模型。

[package]
author = "miyu-agent"
upstream = "https://github.com/miyu-agent/miyu"
prefix = "loop"
protocol = [1, 1]
groups = ["tasks"]
name = { en = "Loop tasks", zh = "循环任务", ja = "ループタスク" }
summary = { en = "/loop runs a task again and again, at a fixed interval or at a pace the AI picks", zh = "/loop 让一件事反复跑，固定间隔或者由 AI 自己定节奏", ja = "/loop で同じ作業を繰り返します。間隔は固定か、AI が自分で決めます" }

# 一个功能，编号同包（施工 BS-1 上中的写法）：写明带的工具，装别的包时照它查工具撞名。
[features.loop]
name = { en = "Loop tasks", zh = "循环任务", ja = "ループタスク" }
summary = { en = "/loop runs a task again and again, at a fixed interval or at a pace the AI picks", zh = "/loop 让一件事反复跑，固定间隔或者由 AI 自己定节奏", ja = "/loop で同じ作業を繰り返します。間隔は固定か、AI が自分で決めます" }
tools = ["schedule_wakeup"]

[builtin]
