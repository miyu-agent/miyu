# 知识库（施工 K-1 下，设计 19 N10）：内置包，代码编在核心里。没写功能，整个包算一个功能，编号 knowledge：她的两件工具
# `kb_search`、`kb_read`。知识库的文件、人经协议查（`kb.*`）不看这个包装没装：文件是人的。给人看的字，不发给模型。

[package]
author = "miyu-agent"
upstream = "https://github.com/miyu-agent/miyu"
protocol = [1, 1]
name = { en = "Knowledge base", zh = "知识库", ja = "ナレッジベース" }
summary = { en = "Let her look things up in your notes and documents", zh = "让她查你放进来的笔记和文档", ja = "あなたのノートや文書を調べられるようにします" }

[builtin]
