# 注入环境信息组的一个包（施工 BS-1 上中，设计 44；施工 FG-1 从基础系统组挪来，设计 52 第一节）：内置包，代码编在核心里，默认装、能关能卸。给人看的字，不发给模型。
# 自动注入 AGENTS 文档（施工 P-14；原来叫项目指令，施工 FG-1 改名）：没有工具，回合开始把仓库里的 AGENTS.md 交给她。

[package]
author = "miyu-agent"
upstream = "https://github.com/miyu-agent/miyu"
prefix = "project-docs"
protocol = [1, 1]
groups = ["environment"]
name = { en = "Inject AGENTS docs automatically", zh = "自动注入 AGENTS 文档", ja = "AGENTS 文書を自動で注入" }
summary = { en = "Give the AI the repository's AGENTS.md at the start of each turn", zh = "每轮开头把仓库里的 AGENTS.md 交给 AI", ja = "毎ターンの始めにリポジトリの AGENTS.md を AI に渡します" }

# 功能写明、编号照旧（施工 PN-2，设计 48 第三节第 1 条）：原来没写，功能编号照包编号算；包改名以后功能编号不跟着变。
[features.project-docs]
name = { en = "Inject AGENTS docs automatically", zh = "自动注入 AGENTS 文档", ja = "AGENTS 文書を自動で注入" }
summary = { en = "Give the AI the repository's AGENTS.md at the start of each turn", zh = "每轮开头把仓库里的 AGENTS.md 交给 AI", ja = "毎ターンの始めにリポジトリの AGENTS.md を AI に渡します" }

[builtin]
