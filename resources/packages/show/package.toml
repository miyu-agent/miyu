# 基础系统组的一个包（施工 BS-1 上中，设计 44）：内置包，代码编在核心里，默认装、能关能卸。给人看的字，不发给模型。

[package]
author = "miyu-agent"
upstream = "https://github.com/miyu-agent/miyu"
protocol = [1, 1]
groups = ["basesystem"]
name = { en = "Show to the user", zh = "展示给用户", ja = "ユーザーに見せる" }
summary = { en = "Show you images, pages, documents, video and audio", zh = "把图片、网页、文档、音视频直接给你看", ja = "画像、ページ、文書、動画や音声をそのまま見せます" }

# 一个功能，编号同包（施工 BS-1 上中）：写明带的工具，装别的包时照它查工具撞名（`miyu_store::packages::conflicts`）。
[features.show]
name = { en = "Show to the user", zh = "展示给用户", ja = "ユーザーに見せる" }
summary = { en = "Show you images, pages, documents, video and audio", zh = "把图片、网页、文档、音视频直接给你看", ja = "画像、ページ、文書、動画や音声をそのまま見せます" }
tools = ["show"]

