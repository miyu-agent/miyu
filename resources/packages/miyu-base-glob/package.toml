# 基础系统组的一个包（施工 BS-1 上中，设计 44）：内置包，代码编在核心里，默认装、能关能卸。给人看的字，不发给模型。

[package]
author = "miyu-agent"
upstream = "https://github.com/miyu-agent/miyu"
prefix = "glob"
protocol = [1, 1]
groups = ["basesystem"]
name = { en = "Find files", zh = "找文件", ja = "ファイルを探す" }
summary = { en = "Find files by name pattern", zh = "照文件名的样子找文件", ja = "名前のパターンでファイルを探します" }

# 一个功能，编号同包（施工 BS-1 上中）：写明带的工具，装别的包时照它查工具撞名（`miyu_store::packages::conflicts`）。
[features.glob]
name = { en = "Find files", zh = "找文件", ja = "ファイルを探す" }
summary = { en = "Find files by name pattern", zh = "照文件名的样子找文件", ja = "名前のパターンでファイルを探します" }
tools = ["glob"]

[builtin]
