# 人格记忆（施工 F-2，设计 30 第二节）：内置包，代码编在核心里。没写功能，整个包算一个功能，编号 memory：三件工具和回合开头的
# 召回。给人看的字，不发给模型。

[package]
author = "miyu-agent"
upstream = "https://github.com/miyu-agent/miyu"
prefix = "memory"
protocol = [1, 1]
groups = ["persona"]
name = { en = "Persona memory", zh = "人格记忆", ja = "ペルソナの記憶" }
summary = { en = "Remember what you said and recall it later", zh = "记住你说过的事，以后想得起来", ja = "話したことを覚えて、あとで思い出します" }

# 推荐内置语义模型（施工 R-5 三补）：没装照起，只有关键词那一路，或者指定远程的模型。
[recommends]
workers = ["miyu-embed"]

# 功能写明、编号照旧（施工 PN-2，设计 48 第三节第 1 条）：原来没写，功能编号照包编号算；包改名以后功能编号不跟着变。
[features.memory]
name = { en = "Persona memory", zh = "人格记忆", ja = "ペルソナの記憶" }
summary = { en = "Remember what you said and recall it later", zh = "记住你说过的事，以后想得起来", ja = "話したことを覚えて、あとで思い出します" }
# 工具写明（施工 FG-1）：预设页照这个先后列（设计 52 第三节第 2 条）。
tools = ["remember", "memory_search", "forget"]

[builtin]
