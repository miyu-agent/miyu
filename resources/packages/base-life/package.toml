# 结束人生（施工 LF-4 下，设计 70 第二节第 3 条、第三节第 5 条）：人格组的一个包，内置，代码编在核心里（`miyu-schedule`），默认装、能关
# 能卸。工具 `end_life`：她自己结束这段人生；`note_change`（施工 LF-11，设计 70 第六节）：她记下自己在人生里变了什么，另算一个
# 功能 `change`，预设里能单独关。`needs = ["life"]`：只在没结束的人生会话里有，别的会话拿同一个预设也没有。给人看的字，不发给模型。

[package]
author = "miyu-agent"
upstream = "https://github.com/miyu-agent/miyu"
prefix = "life"
protocol = [1, 1]
groups = ["persona"]
needs = ["life"]
name = { en = "End of life", zh = "结束人生", ja = "人生の終わり" }
summary = { en = "In a life session, the AI can end this life itself, leaving last words", zh = "人生会话里 AI 可以自己结束这段人生，留下遗言", ja = "人生セッションで、AI が自分でこの人生を終え、最後の言葉を残せます" }

[features.life]
name = { en = "End of life", zh = "结束人生", ja = "人生の終わり" }
summary = { en = "In a life session, the AI can end this life itself, leaving last words", zh = "人生会话里 AI 可以自己结束这段人生，留下遗言", ja = "人生セッションで、AI が自分でこの人生を終え、最後の言葉を残せます" }
tools = ["end_life"]

[features.change]
name = { en = "Change over life", zh = "后天", ja = "後天" }
summary = { en = "In a life session, the AI notes how it has changed; every session with this persona carries the notes", zh = "人生会话里 AI 记下自己变了什么，这个人格的每个会话都带着", ja = "人生セッションで、AI が自分の変化を書き留め、このペルソナのどのセッションにも引き継がれます" }
tools = ["note_change"]

[builtin]
