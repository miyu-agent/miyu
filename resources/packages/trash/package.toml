# 基础系统组的一个包（施工 BS-1 上中，设计 44）：内置包，代码编在核心里，默认装、能关能卸。给人看的字，不发给模型。

[package]
author = "miyu-agent"
upstream = "https://github.com/miyu-agent/miyu"
protocol = [1, 1]
groups = ["basesystem"]
name = { en = "Move to trash", zh = "删到回收站", ja = "ゴミ箱へ" }
summary = { en = "Delete files into the trash, so they can come back", zh = "把文件删进回收站，删错了能找回", ja = "ファイルをゴミ箱に移します。間違えても戻せます" }

# 一个功能，编号同包（施工 BS-1 上中）：写明带的工具，装别的包时照它查工具撞名（`miyu_store::packages::conflicts`）。
[features.trash]
name = { en = "Move to trash", zh = "删到回收站", ja = "ゴミ箱へ" }
summary = { en = "Delete files into the trash, so they can come back", zh = "把文件删进回收站，删错了能找回", ja = "ファイルをゴミ箱に移します。間違えても戻せます" }
tools = ["trash"]

[builtin]
