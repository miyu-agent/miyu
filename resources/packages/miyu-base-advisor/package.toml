# 基础系统组的一个包（施工 ADV-2，设计 69）：内置包，代码编在核心里，默认装、能关能卸。给人看的字，不发给模型。

[package]
author = "miyu-agent"
upstream = "https://github.com/miyu-agent/miyu"
prefix = "advisor"
protocol = [1, 1]
groups = ["basesystem"]
name = { en = "Advisor", zh = "顾问", ja = "アドバイザー" }
summary = { en = "Ask a model in the flagship pool for advice when stuck", zh = "卡住时请旗舰池里的模型出主意", ja = "行き詰まったときにフラッグシッププールのモデルに助言を求めます" }

# 一个功能，编号同包（施工 BS-1 上中）：写明带的工具，装别的包时照它查工具撞名（`miyu_store::packages::conflicts`）。
[features.advisor]
name = { en = "Advisor", zh = "顾问", ja = "アドバイザー" }
summary = { en = "Ask a model in the flagship pool for advice when stuck", zh = "卡住时请旗舰池里的模型出主意", ja = "行き詰まったときにフラッグシッププールのモデルに助言を求めます" }
tools = ["advisor"]

