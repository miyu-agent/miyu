# 基础系统组的一个包（施工 BS-1 上中，设计 44）：内置包，代码编在核心里，默认装、能关能卸。给人看的字，不发给模型。

[package]
author = "miyu-agent"
upstream = "https://github.com/miyu-agent/miyu"
protocol = [1, 1]
groups = ["basesystem"]
name = { en = "Usage", zh = "用量", ja = "使用量" }
summary = { en = "Check how many tokens this session has used", zh = "看这个会话用了多少 token", ja = "このセッションのトークン使用量を見ます" }

# 一个功能，编号同包（施工 BS-1 上中）：写明带的工具，装别的包时照它查工具撞名（`miyu_store::packages::conflicts`）。
[features.session_usage]
name = { en = "Usage", zh = "用量", ja = "使用量" }
summary = { en = "Check how many tokens this session has used", zh = "看这个会话用了多少 token", ja = "このセッションのトークン使用量を見ます" }
tools = ["session_usage"]

[builtin]
