# 出厂的组（施工 BS-1 上中，设计 44 第三节第 2 条）：一个组一段，编号是段名。组里有哪些包由包的清单写（`[package] groups`），只有出厂
# 那一层的内置包能写；这里只给名字、说明。给人看的字，不发给模型。
# 段的先后就是预设页上组的先后（施工 FG-1，设计 52 第一节：`preset.get` 的 `sections` 照它排）。组名也是预设 `[software]` 里能写的词，
# 定了就不轻易改。

[basesystem]
name = { en = "Base system", zh = "基础系统", ja = "基本システム" }
summary = { en = "Read and edit files, run commands, look up earlier talk", zh = "读写文件、跑命令、查以前说过的话", ja = "ファイルの読み書き、コマンドの実行、前の話の検索" }
# 组里的包照用途的先后（施工 PG-1：预设页照它排）；施工 FG-1 照设计 52 第一节的表重排。谁在组里照旧由包的清单写。
order = [
    "miyu-base-read",
    "miyu-base-write",
    "miyu-base-edit",
    "miyu-base-glob",
    "miyu-base-grep",
    "miyu-base-trash",
    "miyu-base-shell",
    "miyu-base-jobs",
    "miyu-base-clicall",
    "miyu-base-subagent",
    "miyu-base-ask-user",
    "miyu-base-show",
    "miyu-base-sessions",
    "miyu-base-history",
    "miyu-base-session-usage",
    "miyu-base-packages",
]

# 任务和定时（施工 FG-1，设计 52 第一节）：待办、定时、循环从基础系统挪来，长期目标原来不在组里。
[tasks]
name = { en = "Tasks and schedules", zh = "任务和定时", ja = "タスクと定期実行" }
summary = { en = "To-do lists, long-running goals, scheduled and loop tasks", zh = "待办清单、长期目标、定时任务和循环任务", ja = "ToDo リスト、長期目標、定期実行とループタスク" }
order = [
    "miyu-base-todowrite",
    "miyu-base-goal",
    "miyu-base-schedule",
    "miyu-base-loop",
]

# 注入环境信息（施工 FG-1，设计 52 第一节）：环境的八块，加上从基础系统挪来的自动注入 AGENTS 文档。
[environment]
name = { en = "Injected environment", zh = "注入环境信息", ja = "注入する環境情報" }
summary = { en = "Tell the AI about the time, the machine, you and the project", zh = "告诉 AI 时间、这台机器、你和项目的情况", ja = "時刻、このマシン、あなたとプロジェクトのことを AI に伝えます" }
order = [
    "miyu-base-env",
    "miyu-base-project-docs",
]

# 人格（施工 FG-1，设计 52 第一节）。
[persona]
name = { en = "Persona", zh = "人格", ja = "ペルソナ" }
summary = { en = "Memory and staying in character", zh = "记忆和人设遵循", ja = "記憶とペルソナの遵守" }
order = [
    "miyu-base-memory",
    "miyu-base-roleplay",
]

# 查资料（施工 FG-1，设计 52 第一节）。
[research]
name = { en = "Research", zh = "查资料", ja = "調べもの" }
summary = { en = "Search the web, fetch pages, use knowledge bases", zh = "网络搜索、抓取网页、查知识库", ja = "ウェブ検索、ページの取得、ナレッジベース" }
order = [
    "miyu-base-net",
    "miyu-base-knowledge",
]
