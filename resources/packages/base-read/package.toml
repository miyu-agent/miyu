# 基础系统组的一个包（施工 BS-1 上中，设计 44）：内置包，代码编在核心里，默认装、能关能卸。给人看的字，不发给模型。

[package]
author = "miyu-agent"
upstream = "https://github.com/miyu-agent/miyu"
prefix = "read"
protocol = [1, 1]
groups = ["basesystem"]
name = { en = "Read files", zh = "读文件", ja = "ファイルを読む" }
summary = { en = "Read text, images and PDFs", zh = "读文本、图片和 PDF", ja = "テキスト、画像、PDF を読みます" }

# 一个功能，编号同包（施工 BS-1 上中）：写明带的工具，装别的包时照它查工具撞名（`miyu_store::packages::conflicts`）。
[features.read]
name = { en = "Read files", zh = "读文件", ja = "ファイルを読む" }
summary = { en = "Read text, images and PDFs", zh = "读文本、图片和 PDF", ja = "テキスト、画像、PDF を読みます" }
tools = ["read"]

[builtin]
