# off =

[permission]
# 新会话的权限级别：调整新会话开启时的默认权限模式，修改后开新会话生效。
# 能写：workspace 或 full。只能写在系统配置或个人设置里。新会话生效。
level = "workspace"

# 新会话开局只读：打开以后，新会话一开始就是只读。AI 只能查、写计划，要改文件时你再关掉只读。项目配置里只能把它打开。
# 能写：true 或 false。只能写在系统配置、个人设置或项目配置里。新会话生效。
start_read_only = false

[persona]
# 默认人格：新会话默认用哪个人格。不设的话，新会话不使用人格，记忆单独一份。
# 能写：小写字母开头的名字，只有小写字母、数字、-、_，最长 64 个字符。只能写在系统配置或个人设置里。新会话生效。
# default =

[pools."<id>"]
# 给模型看的说明：AI 派子代理时看到的一句，接在池名后面。用英文写，一行。
# 能写：最多 60 个字的一行英文。只能写在系统配置或个人设置里。新会话生效。
# description =

# 池的成员：几个模型编成一组，每个写成 供应商/模型。
# 能写：<供应商>/<模型> 的列表。只能写在系统配置或个人设置里。下一轮生效。
# models =

# 池的分法：一个会话一直用一个成员，还是每次请求换下一个。不写的：成员全是按次计费的轮换，别的钉住。
# 能写：pin 或 rotate。只能写在系统配置或个人设置里。下一轮生效。
# strategy =

# 子代理能选：打开以后，新会话里 AI 派子代理时能选这个池。池里有成员才列出来。
# 能写：true 或 false。只能写在系统配置或个人设置里。新会话生效。
subagent = false

[pools.flagship]
# 子代理能选：打开以后，新会话里 AI 派子代理时能选这个池。池里有成员才列出来。
# 能写：true 或 false。只能写在系统配置或个人设置里。新会话生效。
subagent = true

[pools.lite]
# 子代理能选：打开以后，新会话里 AI 派子代理时能选这个池。池里有成员才列出来。
# 能写：true 或 false。只能写在系统配置或个人设置里。新会话生效。
subagent = true

[pools.normal]
# 子代理能选：打开以后，新会话里 AI 派子代理时能选这个池。池里有成员才列出来。
# 能写：true 或 false。只能写在系统配置或个人设置里。新会话生效。
subagent = true

[preset]
# 默认预设：新会话默认用哪个预设。
# 能写：小写字母开头的名字，只有小写字母、数字、-、_，最长 64 个字符。只能写在系统配置或个人设置里。新会话生效。
default = "full"

[profile]
# 更多描述：想让 AI 知道的关于你的事，可以空。通讯平台的群聊里不带。
# 能写：最多 2000 个字的文字，可以分行。只能写在个人设置里。新会话生效。
# about =

# AI 怎么称呼你：AI 平时怎么叫你，例如名字、昵称。
# 能写：最多 64 个字的文字。只能写在个人设置里。新会话生效。
# name =

# AI 用什么语言回复：AI 默认用哪种语言回复，对话里可以随时让它换。
# 能写：最多 64 个字的文字。只能写在个人设置里。新会话生效。
# preferred_reply_language =

[providers."<id>"]
# 地址：这家的接口地址，路径由驱动接在后面。认得出的供应商可以不写。
# 能写：http:// 或 https:// 开头的网址 或 { env = "…" }。只能写在系统配置或个人设置里。下一轮生效。
# base_url =

# 缓存类别：这家的缓存怎么算钱。现在只用来定池不写分法时怎么分。不写照驱动的默认。
# 能写：contract、best_effort 或 per_request。只能写在系统配置或个人设置里。下一轮生效。
# cache =

# 对应的供应商：这家对应资料里的哪一家，例如只转 DeepSeek 的中转写 deepseek。
# 能写：小写字母开头的名字，只有小写字母、数字、-、_，最长 64 个字符。只能写在系统配置或个人设置里。下一轮生效。
# catalog =

# 驱动：怎么和这家说话。认得出的供应商可以不写。
# 能写：openai-chat、anthropic 或 openai-responses。只能写在系统配置或个人设置里。下一轮生效。
# driver =

# key：写 { secret = "名字" }（用 miyu provider login 存）或 { env = "环境变量" }。一家一个，几份额度一起用的配成几家、放进池里。不写的不带认证头。
# 能写：{ secret = "…" } 或 { env = "…" }。只能写在系统配置或个人设置里。下一轮生效。
# key =

# 本机的服务：本机跑的模型服务，价格当 0。不写的照地址：在本机的是。
# 能写：true 或 false。只能写在系统配置或个人设置里。下一轮生效。
# local =

# 显示名：界面上给人看的名字。编号只用来引用模型；不写的照资料里那一家的名字，再没有的照编号。
# 能写：最多 64 个字的文字。只能写在系统配置或个人设置里。立即生效。
# name =

# 倍率：这家的价格照它乘，不写是 1。模型上写的盖过它。
# 能写：0 到 1000 之间的数。只能写在系统配置或个人设置里。下一轮生效。
# price_multiplier =

[providers."<id>".compat]
# 约束解码：这家照参数格式出字，空的参数外壳只能填 {}。打开后，要先加载的工具发给它时带完整格式。不写照档案。
# 能写：true 或 false。只能写在系统配置或个人设置里。下一轮生效。
# strict_tools =

[providers."<id>".models."<model>"]
# 对应目录里的：照 models.dev 目录里的哪一个：<供应商>/<模型>。不写的照名字找。
# 能写：最多 256 个字的文字。只能写在系统配置或个人设置里。下一轮生效。
# catalog =

# 默认的思考强度：这个模型默认的思考强度，写它的一档，例如 high；能关思考的写 off。不写的照供应商的默认。
# 能写：最多 32 个字的文字。只能写在系统配置或个人设置里。下一轮生效。
# effort =

# 能收哪些输入：这个模型能读的：文字、图片、PDF、音频、视频。
# 能写：text、image、pdf、audio 或 video 的列表。只能写在系统配置或个人设置里。下一轮生效。
# inputs =

# 最大输出：这个模型一次最多输出多少 token。
# 能写：1 到 100000000 之间的整数。只能写在系统配置或个人设置里。下一轮生效。
# max_output =

# 倍率：这个模型的价格照它乘，盖过供应商上写的。
# 能写：0 到 1000 之间的数。只能写在系统配置或个人设置里。下一轮生效。
# price_multiplier =

# 思考强度：这个模型的思考强度有哪几级。
# 能写：最多 32 个字的文字 的列表。只能写在系统配置或个人设置里。下一轮生效。
# reasoning =

# 默认的温度：这个模型默认的温度，0 到 2，越高回答越随意。不写的照供应商的默认；这个模型不收温度的不发。
# 能写：0 到 2 之间的数。只能写在系统配置或个人设置里。下一轮生效。
# temperature =

# 能调工具：这个模型能不能调工具。
# 能写：true 或 false。只能写在系统配置或个人设置里。下一轮生效。
# tools =

# 上下文窗口：这个模型的上下文窗口，单位 token。
# 能写：1 到 100000000 之间的整数。只能写在系统配置或个人设置里。下一轮生效。
# window =

[providers."<id>".models."<model>".price]
# 读缓存的价：每一百万读缓存 token 的价。
# 能写：0 到 1000000 之间的数。只能写在系统配置或个人设置里。下一轮生效。
# cache_read =

# 写缓存的价：每一百万写缓存 token 的价。
# 能写：0 到 1000000 之间的数。只能写在系统配置或个人设置里。下一轮生效。
# cache_write =

# 币种：价格的币种，三个大写字母，例如 USD、CNY。不写是 USD。
# 能写：最多 3 个字的文字。只能写在系统配置或个人设置里。下一轮生效。
# currency =

# 输入价：每一百万输入 token 的价。写了价格就整份用手写的。
# 能写：0 到 1000000 之间的数。只能写在系统配置或个人设置里。下一轮生效。
# input =

# 输出价：每一百万输出 token 的价。
# 能写：0 到 1000000 之间的数。只能写在系统配置或个人设置里。下一轮生效。
# output =

[sandbox]
# 沙盒强度：自动挡位默认使用 BubbleWrap，未安装或不可用时回退至 Landlock。
# 能写：auto 或 weak。只能写在系统配置或个人设置里。下一轮生效。
strength = "auto"

[sandbox.private]
# 加的私密目录：命令读写不到、文件工具要先问的目录。
# 能写：最多 4096 个字的文字 的列表。只能写在系统配置或个人设置里。下一轮生效。
# add =

# 私密目录：关掉以后出厂的和加的私密目录都不藏，文件工具也不再问；Miyu 自己的数据照旧藏着。
# 能写：true 或 false。只能写在系统配置或个人设置里。下一轮生效。
enabled = true

# 默认私密目录：出厂就藏起来的目录。留着的照旧私密；去掉的命令读得到、文件工具不再问。恢复默认就全部回来。
# 能写：最多 4096 个字的文字 的列表。只能写在系统配置或个人设置里。下一轮生效。
# remove =

[sandbox.readonly]
# 加的受保护路径：文件工具改之前要先问的文件和目录，读照常。写成 ~/…、绝对路径，或者工作区里的相对路径，例如 .vscode（每一层都算）。
# 能写：最多 4096 个字的文字 的列表。只能写在系统配置或个人设置里。下一轮生效。
# add =

# 受保护的路径：关掉以后出厂的和加的受保护路径都不生效，文件工具改之前不再因为它们问；Miyu 自己的数据照旧护着。
# 能写：true 或 false。只能写在系统配置或个人设置里。下一轮生效。
enabled = true

# 默认受保护路径：出厂就受保护的：工作区里的 .git/hooks、编辑器和 agent 的配置，家目录下的 shell 启动文件这些。留着的照旧，去掉的文件工具不再问。恢复默认就全部回来。
# 能写：最多 4096 个字的文字 的列表。只能写在系统配置或个人设置里。下一轮生效。
# remove =

[sandbox.tools]
# 不套沙盒：这件工具：管理员放行这件工具在沙盒外跑（碰硬件、要 root 的脚本这类）：值写这件工具的来处，自己放的脚本是 ~home，装的包写包的编号，出厂的 shell 是 shell；对不上的不算。放行了的在管理员自己的会话里不问、直接在沙盒外跑，群聊、陌生人的私聊照旧拒绝，只读的时候也拒绝。
# 能写：最多 200 个字的文字。只能写在系统配置里。下一轮生效。
# "<name>" =

[show]
# 提醒 AI 用展示：让 AI 把做出来或拿到的图片、网页、文档、音视频用「展示」直接给你看，而不只是给一个路径。
# 能写：true 或 false。只能写在系统配置或个人设置里。新会话生效。
system_hint = true

[terminal]
# 闲置多久开新会话：上一次说话以后闲置超过这么多分钟，下一句开一个新的终端集成会话，旧会话保留。0 表示不开新的。
# 能写：0 到 525600 之间的整数。只能写在系统配置或个人设置里。立即生效。
idle_new_after = 180

# 终端集成会话的人格：新开的终端集成会话用哪个人格。不设的话跟随默认人格。已经在用的终端集成会话不变。
# 能写：小写字母开头的名字，只有小写字母、数字、-、_，最长 64 个字符。只能写在系统配置或个人设置里。新会话生效。
# persona =

# 终端集成会话的预设：新开的终端集成会话用哪个预设。不设的话跟随默认预设。
# 能写：小写字母开头的名字，只有小写字母、数字、-、_，最长 64 个字符。只能写在系统配置或个人设置里。新会话生效。
# preset =

[ui]
# 默认界面：直接敲 miyu 时打开哪个界面。
# 能写：小写字母开头的名字，只有小写字母、数字、-、_，最长 64 个字符。只能写在系统配置或个人设置里。重启后生效。
head = "tui"

# 界面语言：终端、网页、命令行给你看的字用哪种话。auto 跟着终端或浏览器的语言。
# 能写：auto、zh、en 或 ja。只能写在系统配置或个人设置里。立即生效。
language = "auto"

# 启动时打开：打开终端界面或网页时，开一个新会话，还是接着最近的那一个。
# 能写：new 或 recent。只能写在系统配置或个人设置里。重启后生效。
startup = "new"

# 第一次引导走过了：这个账号已经走完第一次引导，终端、网页不再打开引导。
# 能写：true 或 false。只能写在个人设置里。立即生效。
welcomed = false

[usage]
# 显示的币种：用量的金额照币种各加各的，不换算；这一种排在最前，别的照代码的字母先后。三个大写字母，例如 USD、CNY。
# 能写：最多 3 个字的文字。只能写在系统配置或个人设置里。立即生效。
currency = "USD"
