# Miyu 的全部配置项和默认值。这份是生成的，改它没有用。
# 系统配置写在 system/config.toml，个人设置写在 home/<账号>/settings.toml。

[commands."<id>"]
# 谁能用这条命令：这条斜杠命令谁能用：管理员是终端管理员和群管理员，所有人是群里随便哪个人也行，停用是谁都不行。不写的照命令自带的设置，没有的是管理员。
# 能写：admin、anyone 或 off。只能写在系统配置里。立即生效。
# access =

[compaction]
# 提前压好：上下文快满时，在后台先把旧的那一段压成摘要，到了要压缩的时候直接换上，不用停下来等。关掉的话，照旧到线再压。
# 能写：true 或 false。只能写在系统配置或个人设置里。下一轮生效。
prepare = true

[external.bindings]
# 终端管理员的平台账号：通讯平台上的哪个号是哪个本机账号本人。键写平台上的身份（例如 qq:10001），值写本机账号。私聊里，这个号就是那个账号本人。
# 能写：小写字母开头的名字，只有小写字母、数字、-、_，最长 64 个字符。只能写在系统配置里。立即生效。
# "<external>" =

[log]
# 运行日志的级别：运行日志记到哪一级。排查问题时调成 debug。设了环境变量 MIYU_LOG 的，那一次启动照它。
# 能写：error、warn、info、debug、trace 或 off。只能写在系统配置里。立即生效。
level = "info"

[memory]
# 整理记忆前等多久：聊完闲了这么久，AI 把新聊的内容里值得记的整理成记忆。
# 能写：1m 到 1h 之间的时长，写成 30s、10m、1h 这样。只能写在系统配置或个人设置里。下一轮生效。
extract_idle = "5m"

# 攒几轮再整理：上次整理以后至少聊了这么多轮才整理。
# 能写：1 到 100 之间的整数。只能写在系统配置或个人设置里。下一轮生效。
extract_turns = 2

# 多久归纳一次记忆：隔这么久，AI 把新记的和以前的放在一起理一遍：重复的合掉，过时的作废，写一段对你的了解。
# 能写：1h 到 720h 之间的时长，写成 30s、10m、1h 这样。只能写在系统配置或个人设置里。下一轮生效。
merge_every = "24h"

# 攒几次聊天再归纳：上次归纳以后至少整理过这么多次聊天才归纳。
# 能写：1 到 100 之间的整数。只能写在系统配置或个人设置里。下一轮生效。
merge_sessions = 5

# 整理记忆的模型：整理记忆时用的模型，照用量算钱。没选的用主对话的模型。
# 能写：<供应商>/<模型> 或 @<池>。只能写在系统配置或个人设置里。下一轮生效。
# organizer =

[models]
# 主对话的模型：新会话默认用的模型，写成 供应商/模型，例如 deepseek/deepseek-flash；也能写 @池。
# 能写：<供应商>/<模型> 或 @<池>。只能写在系统配置或个人设置里。新会话生效。
# chat =

# 语义模型：提高记忆、知识库等内容的检索质量。
# 能写：local、off 或 <供应商>/<模型>。只能写在系统配置或个人设置里。下一轮生效。
# embedding =

# 看图的模型：主对话的模型看不了图时，替它看图的模型。写法同主对话的模型。
# 能写：<供应商>/<模型> 或 @<池>。只能写在系统配置或个人设置里。下一轮生效。
# vision =

[models.catalog]
# 多久更新一次：缓存的目录旧过这么久才再拉。
# 能写：1h 到 720h 之间的时长，写成 30s、10m、1h 这样。只能写在系统配置或个人设置里。立即生效。
every = "24h"

# 后台更新目录：在后台去 models.dev 拉新的模型目录。关掉只用安装包带的和已经拉过的。
# 能写：true 或 false。只能写在系统配置或个人设置里。立即生效。
update = true

# 目录的地址：从哪拉模型目录。
# 能写：http:// 或 https:// 开头的网址 或 { env = "…" }。只能写在系统配置或个人设置里。立即生效。
url = "https://models.dev/api.json"

[models.cooldown.auth]
# 认证失败先停用多久：认证失败、额度用完时，整家供应商第一次停用这么久，连着再失败就翻倍。
# 能写：1s 到 1h 之间的时长，写成 30s、10m、1h 这样。只能写在系统配置或个人设置里。立即生效。
base = "10m"

# 认证失败最多停用多久：整家供应商的停用翻倍到这么久为止。
# 能写：1s 到 24h 之间的时长，写成 30s、10m、1h 这样。只能写在系统配置或个人设置里。立即生效。
max = "2h"

[models.cooldown.rate_limited]
# 限速后先冷却多久：一个端点被限速，第一次停用这么久，连着再被限速就翻倍。
# 能写：1s 到 1h 之间的时长，写成 30s、10m、1h 这样。只能写在系统配置或个人设置里。立即生效。
base = "30s"

# 限速最多冷却多久：限速的冷却翻倍到这么久为止，供应商说要等更久的也不超过它。
# 能写：1s 到 24h 之间的时长，写成 30s、10m、1h 这样。只能写在系统配置或个人设置里。立即生效。
max = "10m"

[models.cooldown.retryable]
# 出错后先冷却多久：连不上、服务端出错，第一次停用这么久，连着再出错就翻倍。
# 能写：1s 到 1h 之间的时长，写成 30s、10m、1h 这样。只能写在系统配置或个人设置里。立即生效。
base = "10s"

# 出错最多冷却多久：这类错的冷却翻倍到这么久为止。
# 能写：1s 到 24h 之间的时长，写成 30s、10m、1h 这样。只能写在系统配置或个人设置里。立即生效。
max = "5m"

[net.search]
# 搜索服务供应商：AI 搜网页时用哪一家。自动是 Exa、Parallel、Firecrawl、AnySearch、You.com 依次试，被限额的歇一阵；选了一家的先用它，用不了再依次试别的。这几家都在国外，搜索词会发给它们。自己抓不下来的网页会请 Exa、Firecrawl、Parallel 代抓，网址也会发给它们。
# 能写：auto、exa、parallel、firecrawl、anysearch、you、deepseek、tavily、brave、searxng、duckduckgo 或 bing。只能写在系统配置或个人设置里。下一轮生效。
source = "auto"

[net.search.brave]
# Brave Search：搜索服务供应商选了 Brave 时要它。
# 能写：{ secret = "…" } 或 { env = "…" }。只能写在系统配置或个人设置里。下一轮生效。
# key =

[net.search.deepseek]
# DeepSeek：搜索服务供应商用 DeepSeek 时要它；没配的照用模型那边 DeepSeek 供应商的 key。按次收费。
# 能写：{ secret = "…" } 或 { env = "…" }。只能写在系统配置或个人设置里。下一轮生效。
# key =

[net.search.exa]
# Exa：配了就用你自己的 Exa 额度，不配照免费额度。
# 能写：{ secret = "…" } 或 { env = "…" }。只能写在系统配置或个人设置里。下一轮生效。
# key =

[net.search.searxng]
# SearXNG 的地址：你自己搭的 SearXNG，例如 http://127.0.0.1:8888，要开着 JSON 格式。搜索服务供应商选了 SearXNG 时用它。
# 能写：http:// 或 https:// 开头的网址 或 { env = "…" }。只能写在系统配置或个人设置里。下一轮生效。
# url =

[net.search.tavily]
# Tavily：搜索服务供应商选了 Tavily 时要它。
# 能写：{ secret = "…" } 或 { env = "…" }。只能写在系统配置或个人设置里。下一轮生效。
# key =

[packages]
# 不升级的包：升级时跳过这几个包（写编号），照旧用装着的那一版。
# 能写：最多 64 个字的文字 的列表。只能写在系统配置里。立即生效。
# hold =

# 镜像：官方的软件源连不上或者慢的时候，先照先后试这几个地址。内容照样验签名、比哈希，镜像改不了。
# 能写：http:// 或 https:// 开头的网址 或 { env = "…" } 的列表。只能写在系统配置里。立即生效。
mirrors = []

# 软件源地址：从这里查、下载软件包。默认是官方的软件源；换了地址，那边的内容也得是官方签过名的。
# 能写：http:// 或 https:// 开头的网址 或 { env = "…" }。只能写在系统配置里。立即生效。
source = "https://miyu-agent.github.io/packages/"

[permission]
# 新会话的权限级别：新会话一开始照哪一级：工作区里能读能写、执行命令在沙盒里跑；完全放开不问、也不进沙盒。只管本机开的会话。
# 能写：workspace 或 full。只能写在系统配置或个人设置里。新会话生效。
level = "workspace"

# 新会话开局只读：打开以后，新会话一开始就是只读。AI 只能查、写计划，要改文件时你再关掉只读。项目配置里只能把它打开。
# 能写：true 或 false。只能写在系统配置、个人设置或项目配置里。新会话生效。
start_read_only = false

[persona]
# 默认人格：新会话默认用哪个人格。不设的话，新会话不使用人格，记忆单独一份。
# 能写：小写字母开头的名字，只有小写字母、数字、-、_，最长 64 个字符。只能写在系统配置或个人设置里。新会话生效。
# default =

[pools."<id>"]
# 给模型看的说明：AI 派子代理时看到的一句，接在池名后面。用英文写，一行。
# 能写：最多 60 个字的一行英文。只能写在系统配置或个人设置里。新会话生效。
# description =

# 池的成员：几个模型编成一组，每个写成 供应商/模型。
# 能写：<供应商>/<模型> 的列表。只能写在系统配置或个人设置里。下一轮生效。
# models =

# 池的分法：一个会话一直用一个成员，还是每次请求换下一个。不写的：成员全是按次计费的轮换，别的钉住。
# 能写：pin 或 rotate。只能写在系统配置或个人设置里。下一轮生效。
# strategy =

# 子代理能选：打开以后，新会话里 AI 派子代理时能选这个池。池里有成员才列出来。
# 能写：true 或 false。只能写在系统配置或个人设置里。新会话生效。
subagent = false

[preset]
# 默认预设：新会话默认用哪个预设。
# 能写：小写字母开头的名字，只有小写字母、数字、-、_，最长 64 个字符。只能写在系统配置或个人设置里。新会话生效。
default = "full"

[profile]
# 更多描述：想让 AI 知道的关于你的事，可以空。通讯平台的群聊里不带。
# 能写：最多 2000 个字的文字，可以分行。只能写在个人设置里。新会话生效。
# about =

# AI 怎么称呼你：AI 平时怎么叫你，例如名字、昵称。
# 能写：最多 64 个字的文字。只能写在个人设置里。新会话生效。
# name =

# AI 用什么语言回复：AI 默认用哪种语言回复，对话里可以随时让它换。
# 能写：最多 64 个字的文字。只能写在个人设置里。新会话生效。
# preferred_reply_language =

[providers."<id>"]
# 地址：这家的接口地址，路径由驱动接在后面。认得出的供应商可以不写。
# 能写：http:// 或 https:// 开头的网址 或 { env = "…" }。只能写在系统配置或个人设置里。下一轮生效。
# base_url =

# 缓存类别：这家的缓存怎么算钱。现在只用来定池不写分法时怎么分。不写照驱动的默认。
# 能写：contract、best_effort 或 per_request。只能写在系统配置或个人设置里。下一轮生效。
# cache =

# 对应的供应商：这家对应资料里的哪一家，例如只转 DeepSeek 的中转写 deepseek。
# 能写：小写字母开头的名字，只有小写字母、数字、-、_，最长 64 个字符。只能写在系统配置或个人设置里。下一轮生效。
# catalog =

# 驱动：怎么和这家说话。认得出的供应商可以不写。
# 能写：openai-chat、anthropic 或 openai-responses。只能写在系统配置或个人设置里。下一轮生效。
# driver =

# key：写 { secret = "名字" }（用 miyu login 存）或 { env = "环境变量" }。一家一个，几份额度一起用的配成几家、放进池里。不写的不带认证头。
# 能写：{ secret = "…" } 或 { env = "…" }。只能写在系统配置或个人设置里。下一轮生效。
# key =

# 本机的服务：本机跑的模型服务，价格当 0。不写的照地址：在本机的是。
# 能写：true 或 false。只能写在系统配置或个人设置里。下一轮生效。
# local =

# 显示名：界面上给人看的名字。编号只用来引用模型；不写的照资料里那一家的名字，再没有的照编号。
# 能写：最多 64 个字的文字。只能写在系统配置或个人设置里。立即生效。
# name =

# 倍率：这家的价格照它乘，不写是 1。模型上写的盖过它。
# 能写：0 到 1000 之间的数。只能写在系统配置或个人设置里。下一轮生效。
# price_multiplier =

[providers."<id>".compat]
# 约束解码：这家照参数格式出字，空的参数外壳只能填 {}。打开后，要先加载的工具发给它时带完整格式。不写照档案。
# 能写：true 或 false。只能写在系统配置或个人设置里。下一轮生效。
# strict_tools =

[providers."<id>".models."<model>"]
# 对应目录里的：照 models.dev 目录里的哪一个：<供应商>/<模型>。不写的照名字找。
# 能写：最多 256 个字的文字。只能写在系统配置或个人设置里。下一轮生效。
# catalog =

# 默认的思考强度：这个模型默认的思考强度，写它的一档，例如 high；能关思考的写 off。不写的照供应商的默认。
# 能写：最多 32 个字的文字。只能写在系统配置或个人设置里。下一轮生效。
# effort =

# 能收哪些输入：这个模型能读的：文字、图片、PDF、音频、视频。
# 能写：text、image、pdf、audio 或 video 的列表。只能写在系统配置或个人设置里。下一轮生效。
# inputs =

# 最大输出：这个模型一次最多输出多少 token。
# 能写：1 到 100000000 之间的整数。只能写在系统配置或个人设置里。下一轮生效。
# max_output =

# 倍率：这个模型的价格照它乘，盖过供应商上写的。
# 能写：0 到 1000 之间的数。只能写在系统配置或个人设置里。下一轮生效。
# price_multiplier =

# 思考强度：这个模型的思考强度有哪几级。
# 能写：最多 32 个字的文字 的列表。只能写在系统配置或个人设置里。下一轮生效。
# reasoning =

# 默认的温度：这个模型默认的温度，0 到 2，越高回答越随意。不写的照供应商的默认；这个模型不收温度的不发。
# 能写：0 到 2 之间的数。只能写在系统配置或个人设置里。下一轮生效。
# temperature =

# 能调工具：这个模型能不能调工具。
# 能写：true 或 false。只能写在系统配置或个人设置里。下一轮生效。
# tools =

# 上下文窗口：这个模型的上下文窗口，单位 token。
# 能写：1 到 100000000 之间的整数。只能写在系统配置或个人设置里。下一轮生效。
# window =

[providers."<id>".models."<model>".price]
# 读缓存的价：每一百万读缓存 token 的价。
# 能写：0 到 1000000 之间的数。只能写在系统配置或个人设置里。下一轮生效。
# cache_read =

# 写缓存的价：每一百万写缓存 token 的价。
# 能写：0 到 1000000 之间的数。只能写在系统配置或个人设置里。下一轮生效。
# cache_write =

# 币种：价格的币种，三个大写字母，例如 USD、CNY。不写是 USD。
# 能写：最多 3 个字的文字。只能写在系统配置或个人设置里。下一轮生效。
# currency =

# 输入价：每一百万输入 token 的价。写了价格就整份用手写的。
# 能写：0 到 1000000 之间的数。只能写在系统配置或个人设置里。下一轮生效。
# input =

# 输出价：每一百万输出 token 的价。
# 能写：0 到 1000000 之间的数。只能写在系统配置或个人设置里。下一轮生效。
# output =

[terminal]
# 闲置多久开新会话：上一次说话以后闲置超过这么多分钟，下一句开一个新的终端会话，旧会话保留。0 表示不开新的。
# 能写：0 到 525600 之间的整数。只能写在系统配置或个人设置里。立即生效。
idle_new_after = 240

# 终端会话的人格：新开的终端会话用哪个人格。不设的话跟随默认人格。已经在用的终端会话不变。
# 能写：小写字母开头的名字，只有小写字母、数字、-、_，最长 64 个字符。只能写在系统配置或个人设置里。新会话生效。
# persona =

# 终端会话的预设：新开的终端会话用哪个预设。不设的话跟随默认预设。
# 能写：小写字母开头的名字，只有小写字母、数字、-、_，最长 64 个字符。只能写在系统配置或个人设置里。新会话生效。
# preset =

[ui]
# 默认界面：直接敲 miyu 时打开哪个界面。
# 能写：小写字母开头的名字，只有小写字母、数字、-、_，最长 64 个字符。只能写在系统配置或个人设置里。重启后生效。
head = "tui"

# 界面语言：终端、网页、命令行给你看的字用哪种话。auto 跟着终端或浏览器的语言。
# 能写：auto、zh、en 或 ja。只能写在系统配置或个人设置里。立即生效。
language = "auto"

# 启动时打开：打开终端界面或网页时，开一个新会话，还是接着最近的那一个。
# 能写：new 或 recent。只能写在系统配置或个人设置里。重启后生效。
startup = "new"

# 第一次引导走过了：这个账号已经走完第一次引导，终端、网页不再打开引导。
# 能写：true 或 false。只能写在个人设置里。立即生效。
welcomed = false

[usage]
# 显示的币种：用量的金额照币种各加各的，不换算；这一种排在最前，别的照代码的字母先后。三个大写字母，例如 USD、CNY。
# 能写：最多 3 个字的文字。只能写在系统配置或个人设置里。立即生效。
currency = "USD"
