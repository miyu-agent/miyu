[packages.sources."<id>"]
# Other source key: The Ed25519 public key (base64) its index is signed with. An index that doesn't verify isn't taken.
# Allowed: text of at most 64 characters. Only in the system config. Takes effect immediately.
# key =

# Other source address: The folder holding its index. Together with a key it makes a source you trust. It goes in the system config.
# Allowed: an address starting with http:// or https:// or { env = "…" }. Only in the system config. Takes effect immediately.
# url =

[permission]
# Start new sessions read-only: When on, new sessions begin read-only. The AI can look around and plan, and you turn read-only off when files should change. A project config can only turn it on.
# Allowed: true or false. Only in the system config or a project config. Applies to new sessions.
start_read_only = false

[permission.confirm]
# Containers using host devices: Ask before a container takes the host's devices, process or network namespace.
# Allowed: true or false. Only in the system config. Takes effect next turn.
container = true

# Recursive deletes: Ask before deleting the working directory or a parent of it, or a whole directory whose target is only known at run time.
# Allowed: true or false. Only in the system config. Takes effect next turn.
delete = true

# Destructive git operations: Ask before a force push, reset --hard, clean -f, discarding changes or dropping a stash.
# Allowed: true or false. Only in the system config. Takes effect next turn.
git = true

# Running a download directly: Ask before commands like curl … | sh.
# Allowed: true or false. Only in the system config. Takes effect next turn.
pipe_to_shell = true

# Shutdown and restart: Ask before shutting down or restarting.
# Allowed: true or false. Only in the system config. Takes effect next turn.
power = true

# Confirmation timeout: Anything waiting for your confirmation is denied after this many seconds. 0 waits forever.
# Allowed: a whole number from 0 to 86400. Only in the system config. Takes effect next turn.
timeout = 300

[persona]
# Default persona: The persona new sessions use. When unset, new sessions have no persona: no character prompt, and a memory of their own.
# Allowed: a name starting with a lowercase letter, using only lowercase letters, digits, - and _, up to 64 characters. Only in the system config. Applies to new sessions.
# default =

[pools."<id>"]
# Description for the model: One line the AI sees after the pool name when it starts a subagent. Write it in English.
# Allowed: one line of English, at most 60 characters. Only in the system config. Applies to new sessions.
# description =

# Pool members: A group of models, each written as provider/model.
# Allowed: a list of <provider>/<model>. Only in the system config. Takes effect next turn.
# models =

# Pool strategy: Keep a session on one member, take the next member for every request, or start from the first member every time (a main model with backups used only on errors). Left out, a pool whose members are all billed per request rotates and the others pin.
# Allowed: pin, rotate or ordered. Only in the system config. Takes effect next turn.
# strategy =

# Subagents can pick it: When on, the AI can pick this pool for a subagent in new sessions. It is listed only once it has members.
# Allowed: true or false. Only in the system config. Applies to new sessions.
subagent = false

[pools.flagship]
# Subagents can pick it: When on, the AI can pick this pool for a subagent in new sessions. It is listed only once it has members.
# Allowed: true or false. Only in the system config. Applies to new sessions.
subagent = true

[pools.lite]
# Subagents can pick it: When on, the AI can pick this pool for a subagent in new sessions. It is listed only once it has members.
# Allowed: true or false. Only in the system config. Applies to new sessions.
subagent = true

[pools.normal]
# Subagents can pick it: When on, the AI can pick this pool for a subagent in new sessions. It is listed only once it has members.
# Allowed: true or false. Only in the system config. Applies to new sessions.
subagent = true

[preset]
# Default preset: The preset new sessions use.
# Allowed: a name starting with a lowercase letter, using only lowercase letters, digits, - and _, up to 64 characters. Only in the system config. Applies to new sessions.
default = "full"

[profile]
# More about you: Anything you want the AI to know about you; can be left empty. Not included in group chats on messaging platforms.
# Allowed: text of at most 2000 characters; line breaks allowed. Only in the system config. Applies to new sessions.
# about =

# What the AI calls you: How the AI addresses you, such as your name or a nickname.
# Allowed: text of at most 64 characters. Only in the system config. Applies to new sessions.
# name =

# What language should the AI reply in: The language the AI replies in by default. You can ask it to switch at any time.
# Allowed: text of at most 64 characters. Only in the system config. Applies to new sessions.
# preferred_reply_language =

[providers."<id>"]
# Address: The address of this provider's API; the driver adds the path. Known providers can leave it out.
# Allowed: an address starting with http:// or https:// or { env = "…" }. Only in the system config. Takes effect next turn.
# base_url =

# Cache class: How this provider bills its cache. For now it only decides how a pool without a strategy splits. Left out, it follows the driver.
# Allowed: contract, best_effort or per_request. Only in the system config. Takes effect next turn.
# cache =

# Catalog provider: Which provider in the model data this one is, for example deepseek for a relay that only forwards DeepSeek.
# Allowed: a name starting with a lowercase letter, using only lowercase letters, digits, - and _, up to 64 characters. Only in the system config. Takes effect next turn.
# catalog =

# Driver: How to talk to this provider. Known providers can leave it out.
# Allowed: openai-chat, anthropic or openai-responses. Only in the system config. Takes effect next turn.
# driver =

# Key: Write { secret = "name" } (saved with miyu provider login) or { env = "VARIABLE" }. One per provider; to use several quotas together, set up several providers and put them in a pool. Without one, no auth header is sent.
# Allowed: { secret = "…" } or { env = "…" }. Only in the system config. Takes effect next turn.
# key =

# Local service: A model service on this machine, counted as free. Left out, it follows the address: on this machine means yes.
# Allowed: true or false. Only in the system config. Takes effect next turn.
# local =

# Display name: The name people see. The id is only for referring to models; without one, the model data's name for this provider is used, then the id.
# Allowed: text of at most 64 characters. Only in the system config. Takes effect immediately.
# name =

# Price multiplier: Prices of this provider are multiplied by it. 1 if left out. A multiplier on the model wins.
# Allowed: a number from 0 to 1000. Only in the system config. Takes effect next turn.
# price_multiplier =

[providers."<id>".models."<model>"]
# Catalog entry: Which models.dev entry to use: <provider>/<model>. Left out, it is found by name.
# Allowed: text of at most 256 characters. Only in the system config. Takes effect next turn.
# catalog =

# Thinking effort: The thinking effort this model uses by default: one of its levels, for example high, or off where thinking can be turned off. Left out, the provider decides.
# Allowed: text of at most 32 characters. Only in the system config. Takes effect next turn.
# effort =

# Inputs: What this model can read: text, images, PDF, audio, video.
# Allowed: a list of text, image, pdf, audio or video. Only in the system config. Takes effect next turn.
# inputs =

# Max output: How many tokens this model can write at most in one reply.
# Allowed: a whole number from 1 to 100000000. Only in the system config. Takes effect next turn.
# max_output =

# Price multiplier: Prices of this model are multiplied by it, over the one on the provider.
# Allowed: a number from 0 to 1000. Only in the system config. Takes effect next turn.
# price_multiplier =

# Thinking effort levels: Which thinking effort levels this model offers.
# Allowed: a list of text of at most 32 characters. Only in the system config. Takes effect next turn.
# reasoning =

# Default temperature: The temperature this model uses by default, from 0 to 2; higher gives looser answers. Left out, the provider decides. Not sent to models that do not take one.
# Allowed: a number from 0 to 2. Only in the system config. Takes effect next turn.
# temperature =

# Tool calls: Whether this model can call tools.
# Allowed: true or false. Only in the system config. Takes effect next turn.
# tools =

# Context window: The context window of this model, in tokens.
# Allowed: a whole number from 1 to 100000000. Only in the system config. Takes effect next turn.
# window =

[providers."<id>".models."<model>".price]
# Cache read price: Price per million tokens read from the cache.
# Allowed: a number from 0 to 1000000. Only in the system config. Takes effect next turn.
# cache_read =

# Cache write price: Price per million tokens written to the cache.
# Allowed: a number from 0 to 1000000. Only in the system config. Takes effect next turn.
# cache_write =

# Currency: Currency of the price, three capital letters such as USD or CNY. USD if left out.
# Allowed: text of at most 3 characters. Only in the system config. Takes effect next turn.
# currency =

# Input price: Price per million input tokens. A written price is used whole.
# Allowed: a number from 0 to 1000000. Only in the system config. Takes effect next turn.
# input =

# Output price: Price per million output tokens.
# Allowed: a number from 0 to 1000000. Only in the system config. Takes effect next turn.
# output =

[sandbox.private]
# Added private folders
# Allowed: a list of text of at most 4096 characters. Only in the system config. Takes effect next turn.
# add =

# Private folders: Applies only in read-only, where commands can't read private folders and file tools ask before reading them; with full access nothing is blocked. When off, read-only stops hiding and asking too; Miyu's own data is unaffected.
# Allowed: true or false. Only in the system config. Takes effect next turn.
enabled = true

# Default private folders: The built-in private folders; they apply only in read-only. The ones kept stay private; for the ones taken out, commands can read them and file tools stop asking. Restoring the default brings them all back.
# Allowed: a list of text of at most 4096 characters. Only in the system config. Takes effect next turn.
# remove =

[show]
# Remind the AI to use Show: Has the AI hand over images, web pages, documents, video and audio it makes or fetches with Show, so you see them right away instead of just a path.
# Allowed: true or false. Only in the system config. Applies to new sessions.
system_hint = true

[skills.external]
# Other skill folders: Folders read while "Read skills from other folders" is on, in order; on a name clash the earlier one wins. Write ~/… or an absolute path.
# Allowed: a list of text of at most 4096 characters. Only in the system config. Takes effect next turn.
dirs = ["~/.agents/skills"]

# Read skills from other folders: When on, skills in "Other skill folders" can be used too: apps like Codex and opencode often install theirs in ~/.agents/skills. Miyu's own skills win on a name clash, and Miyu never deletes these.
# Allowed: true or false. Only in the system config. Takes effect next turn.
enabled = false

[terminal]
# New session after idle: After this many minutes without a message, the next one starts a new shell integration session; the old one is kept. 0 never starts a new one.
# Allowed: a whole number from 0 to 525600. Only in the system config. Takes effect immediately.
idle_new_after = 180

# Shell integration session persona: The persona for a new shell integration session. Unset follows the default persona. A shell integration session in use keeps its own.
# Allowed: a persona id. Only in the system config. Applies to new sessions.
# persona =

# Shell integration session preset: The preset for a new shell integration session. Unset follows the default preset.
# Allowed: a preset id. Only in the system config. Applies to new sessions.
# preset =

[ui]
# Default interface: The interface plain miyu opens.
# Allowed: a name starting with a lowercase letter, using only lowercase letters, digits, - and _, up to 64 characters. Only in the system config. Takes effect after restart.
head = "tui"

# Interface language: The language terminals, the web page and the command line use for you. auto follows the terminal or browser.
# Allowed: auto, zh, en or ja. Only in the system config. Takes effect immediately.
language = "auto"

# On start, open: Whether a terminal interface or the web page opens a new session or picks up the most recent one.
# Allowed: new or recent. Only in the system config. Takes effect after restart.
startup = "new"

# First-run guide done: The first-run guide is done; the terminal and web pages no longer open it.
# Allowed: true or false. Only in the system config. Takes effect immediately.
welcomed = false

[usage]
# Currency shown first: Amounts are shown in this currency, converted at each entry's day's rate; without a rate the amount is not shown. Three capital letters such as USD or CNY.
# Allowed: text of at most 3 characters. Only in the system config. Takes effect immediately.
currency = "USD"
