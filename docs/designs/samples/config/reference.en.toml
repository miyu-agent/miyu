# Every Miyu setting and its default. This file is generated. Editing it has no effect.
# Write the system config in system/config.toml and personal settings in home/<account>/settings.toml.

[basesystem.show]
# Remind the AI to use Show: Has the AI hand over images, web pages, documents, video and audio it makes or fetches with Show, so you see them right away instead of just a path.
# Allowed: true or false. Only in the system config or personal settings. Applies to new sessions.
system_hint = true

[clicall.mcp]
# Callable from scripts: this MCP server's tools: When on, all of this server's tools can be called with miyu call; when off, only directly. A tool with its own setting follows that one.
# Allowed: true or false. Only in the system config or personal settings. Takes effect next turn.
# "<id>" =

[clicall.tools]
# Callable from scripts: When on, the AI can also call this tool with miyu call inside a command, and the result goes to the script; when off, it can only be called directly. Unset follows how it was registered (MCP servers and script tools are callable, among built-in tools only search, fetching pages, memory search and the knowledge base tools are, extension tools are not). Tools that write or send messages stay uncallable even when on.
# Allowed: true or false. Only in the system config or personal settings. Takes effect next turn.
# "<name>" =

[commands."<id>"]
# Who can use this command: Who can use this slash command: admins are the terminal admin and group admins, everyone means anyone in the chat, off means no one. When unset, the command's own setting applies, otherwise admins.
# Allowed: admin, anyone or off. Only in the system config. Takes effect immediately.
# access =

[compaction]
# Prepare compaction early: When the context is nearly full, the older part is summarized in the background, so the switch happens without a wait when compaction is due. Off means compacting only once the limit is reached, as before.
# Allowed: true or false. Only in the system config or personal settings. Takes effect next turn.
prepare = true

[core]
# Core idle exit: Minutes with no connection and no running turn before the core exits. 0 keeps it running (the default); a head starts the core again when it can't reach it.
# Allowed: a whole number from 0 to 525600. Only in the system config. Takes effect immediately.
idle_exit = 0

[external.bindings]
# Terminal admin's platform accounts: Which platform identity is which local account. The key is the platform identity (for example qq:10001), the value is the local account. In private chats that identity is that account itself.
# Allowed: a name starting with a lowercase letter, using only lowercase letters, digits, - and _, up to 64 characters. Only in the system config. Takes effect immediately.
# "<external>" =

[features]
# Turn this skill, script or MCP server on: Presets that turn on what they don't list follow this switch for the skill, script or MCP server, except where a preset turns it on or off itself. Presets that leave unlisted features off ignore it.
# Allowed: true or false. Only in the system config or personal settings. Takes effect next turn.
# "<name>" =

[jobs]
# Longest background command: A command the AI runs in the background is stopped after this long, and the AI is told. At most 2 hours.
# Allowed: a length of time from 1m to 2h, written like 30s, 10m or 1h. Only in the system config or personal settings. Takes effect next turn.
max_running = "30m"

[loading.mcp]
# Load this MCP server's tools on demand: When on, the server's tools send only their names and descriptions and load before use; when off, they are sent in full. A tool with its own setting follows that one.
# Allowed: true or false. Only in the system config or personal settings. Takes effect next turn.
# "<id>" =

[loading.tools]
# Load this tool on demand: When on, only the tool's name and description are sent, and its full parameters load before use; when off, it is sent in full. Unset follows how it was registered (scripts and MCP servers load on demand, built-in and extension tools go in full).
# Allowed: true or false. Only in the system config or personal settings. Takes effect next turn.
# "<name>" =

[log]
# Runtime log level: How much the runtime log records. Set debug when chasing a problem. MIYU_LOG, when set, wins for that launch.
# Allowed: error, warn, info, debug, trace or off. Only in the system config. Takes effect immediately.
level = "info"

[memory]
# Consolidation runs to keep: Keep only this many of the latest consolidation runs for each memory. Older ones go to the trash. 0 deletes each run when it ends.
# Allowed: a whole number from 0 to 1000. Only in the system config or personal settings. Takes effect next turn.
dream_keep = 20

# Wait before organizing memories: Once the conversation has been quiet this long, the AI turns what is worth keeping from the new part into memories.
# Allowed: a length of time from 1m to 1h, written like 30s, 10m or 1h. Only in the system config or personal settings. Takes effect next turn.
extract_idle = "30m"

# Turns before organizing: The AI organizes only after at least this many turns since the last time.
# Allowed: a whole number from 1 to 100. Only in the system config or personal settings. Takes effect next turn.
extract_turns = 2

# How often to consolidate memories: After this long the AI goes over new and older memories together: drops repeats and outdated ones, and writes a summary of what it knows about you.
# Allowed: a length of time from 1h to 720h, written like 30s, 10m or 1h. Only in the system config or personal settings. Takes effect next turn.
merge_every = "24h"

# Chats before consolidating: Consolidate only after memories have been taken from at least this many chats since the last time.
# Allowed: a whole number from 1 to 100. Only in the system config or personal settings. Takes effect next turn.
merge_sessions = 5

# Memory organizer model: The model used to organize memories, billed by usage. If none is chosen, the chat model is used.
# Allowed: <provider>/<model> or @<pool>. Only in the system config or personal settings. Takes effect next turn.
# organizer =

[models]
# Chat model: The model new sessions use, written as provider/model, for example deepseek/deepseek-flash, or @pool.
# Allowed: <provider>/<model> or @<pool>. Only in the system config or personal settings. Applies to new sessions.
# chat =

# Semantic model: Improves search quality for memories, knowledge bases and more.
# Allowed: local, off or <provider>/<model>. Only in the system config or personal settings. Takes effect next turn.
# embedding =

# Vision model: Looks at images for the chat model when it cannot. Written like the chat model.
# Allowed: <provider>/<model> or @<pool>. Only in the system config or personal settings. Takes effect next turn.
# vision =

[models.catalog]
# Update every: Fetch again once the cached catalog is this old.
# Allowed: a length of time from 1h to 720h, written like 30s, 10m or 1h. Only in the system config or personal settings. Takes effect immediately.
every = "24h"

# Update the catalog: Fetch a newer model catalog from models.dev in the background. Off uses only the bundled and already fetched ones.
# Allowed: true or false. Only in the system config or personal settings. Takes effect immediately.
update = true

# Catalog address: Where to fetch the model catalog from.
# Allowed: an address starting with http:// or https:// or { env = "…" }. Only in the system config or personal settings. Takes effect immediately.
url = "https://models.dev/api.json"

[models.cooldown.auth]
# Auth failure pause: How long a whole provider rests the first time it fails to authenticate or runs out of quota. It doubles each time in a row.
# Allowed: a length of time from 1s to 1h, written like 30s, 10m or 1h. Only in the system config or personal settings. Takes effect immediately.
base = "10m"

# Auth failure pause cap: The pause for a whole provider stops doubling here.
# Allowed: a length of time from 1s to 24h, written like 30s, 10m or 1h. Only in the system config or personal settings. Takes effect immediately.
max = "2h"

[models.cooldown.rate_limited]
# Rate limit cooldown: How long an endpoint rests the first time it is rate limited. It doubles each time in a row.
# Allowed: a length of time from 1s to 1h, written like 30s, 10m or 1h. Only in the system config or personal settings. Takes effect immediately.
base = "30s"

# Rate limit cooldown cap: The rate limit cooldown stops doubling here, even when the provider asks for longer.
# Allowed: a length of time from 1s to 24h, written like 30s, 10m or 1h. Only in the system config or personal settings. Takes effect immediately.
max = "10m"

[models.cooldown.retryable]
# Error cooldown: How long an endpoint rests the first time it cannot be reached or fails on its side. It doubles each time in a row.
# Allowed: a length of time from 1s to 1h, written like 30s, 10m or 1h. Only in the system config or personal settings. Takes effect immediately.
base = "10s"

# Error cooldown cap: The cooldown for these errors stops doubling here.
# Allowed: a length of time from 1s to 24h, written like 30s, 10m or 1h. Only in the system config or personal settings. Takes effect immediately.
max = "5m"

[net]
# Internal domains: Domains the AI never visits on behalf of others (members, people in group chats), subdomains included, whatever they resolve to and whether or not a proxy is used; the admin is not affected. For example example-corp.com.
# Allowed: a list of text of at most 253 characters. Only in the system config. Takes effect next turn.
# internal_domains =

[net.search]
# Search provider: Which service AI uses to search the web. Auto tries Exa, Parallel, Firecrawl, AnySearch and You.com in turn and rests any that hit a rate limit; a chosen one is tried first, then the others. These services are outside China and receive the search terms. Pages that can't be fetched directly are fetched by Exa, Firecrawl or Parallel, which then receive the address.
# Allowed: auto, exa, parallel, firecrawl, anysearch, you, deepseek, tavily, brave, searxng, duckduckgo or bing. Only in the system config or personal settings. Takes effect next turn.
source = "auto"

[net.search.brave]
# Brave Search: Needed when Brave is the search provider.
# Allowed: { secret = "…" } or { env = "…" }. Only in the system config or personal settings. Takes effect next turn.
# key =

[net.search.deepseek]
# DeepSeek: Needed when DeepSeek is the search provider; if unset, the key of your DeepSeek model provider is used. Charged per search.
# Allowed: { secret = "…" } or { env = "…" }. Only in the system config or personal settings. Takes effect next turn.
# key =

[net.search.exa]
# Exa: With a key, searches use your own Exa quota; without one, the free quota.
# Allowed: { secret = "…" } or { env = "…" }. Only in the system config or personal settings. Takes effect next turn.
# key =

[net.search.searxng]
# SearXNG address: Your own SearXNG instance, for example http://127.0.0.1:8888, with the JSON format enabled. Used when SearXNG is the search provider.
# Allowed: an address starting with http:// or https:// or { env = "…" }. Only in the system config or personal settings. Takes effect next turn.
# url =

[net.search.tavily]
# Tavily: Needed when Tavily is the search provider.
# Allowed: { secret = "…" } or { env = "…" }. Only in the system config or personal settings. Takes effect next turn.
# key =

[packages]
# Held packages: Packages (by id) skipped when upgrading; the installed version stays.
# Allowed: a list of text of at most 64 characters. Only in the system config. Takes effect immediately.
# hold =

# Mirrors: Tried in order before the source when it is slow or unreachable. Content is still checked against the signature and hashes, so a mirror can't change it.
# Allowed: a list of an address starting with http:// or https:// or { env = "…" }. Only in the system config. Takes effect immediately.
mirrors = []

# Package source address: Where to look up and download packages. The official source by default; any other address must serve content signed by the official key.
# Allowed: an address starting with http:// or https:// or { env = "…" }. Only in the system config. Takes effect immediately.
source = "https://miyu-agent.github.io/packages/"

[packages."<id>"]
# Turn this package off for me: Only for you: your sessions get none of this package's tools, skills, commands or the text it adds to the conversation, and the settings and preset pages leave it out. Others keep it. Required packages can't be turned off.
# Allowed: true or false. Only in personal settings. Takes effect next turn.
# off =

[packages.authoring]
# Turn this package off for me: Only for you: your sessions get none of this package's tools, skills, commands or the text it adds to the conversation, and the settings and preset pages leave it out. Others keep it. Required packages can't be turned off.
# Allowed: true or false. Only in personal settings. Takes effect next turn.
# off =

[packages.env]
# Turn this package off for me: Only for you: your sessions get none of this package's tools, skills, commands or the text it adds to the conversation, and the settings and preset pages leave it out. Others keep it. Required packages can't be turned off.
# Allowed: true or false. Only in personal settings. Takes effect next turn.
# off =

[packages.goal]
# Turn this package off for me: Only for you: your sessions get none of this package's tools, skills, commands or the text it adds to the conversation, and the settings and preset pages leave it out. Others keep it. Required packages can't be turned off.
# Allowed: true or false. Only in personal settings. Takes effect next turn.
# off =

[packages.knowledge]
# Turn this package off for me: Only for you: your sessions get none of this package's tools, skills, commands or the text it adds to the conversation, and the settings and preset pages leave it out. Others keep it. Required packages can't be turned off.
# Allowed: true or false. Only in personal settings. Takes effect next turn.
# off =

[packages.memory]
# Turn this package off for me: Only for you: your sessions get none of this package's tools, skills, commands or the text it adds to the conversation, and the settings and preset pages leave it out. Others keep it. Required packages can't be turned off.
# Allowed: true or false. Only in personal settings. Takes effect next turn.
# off =

[packages.mermaid]
# Turn this package off for me: Only for you: your sessions get none of this package's tools, skills, commands or the text it adds to the conversation, and the settings and preset pages leave it out. Others keep it. Required packages can't be turned off.
# Allowed: true or false. Only in personal settings. Takes effect next turn.
# off =

[packages.net]
# Turn this package off for me: Only for you: your sessions get none of this package's tools, skills, commands or the text it adds to the conversation, and the settings and preset pages leave it out. Others keep it. Required packages can't be turned off.
# Allowed: true or false. Only in personal settings. Takes effect next turn.
# off =

[packages.roleplay]
# Turn this package off for me: Only for you: your sessions get none of this package's tools, skills, commands or the text it adds to the conversation, and the settings and preset pages leave it out. Others keep it. Required packages can't be turned off.
# Allowed: true or false. Only in personal settings. Takes effect next turn.
# off =

[permission]
# Permission level for new sessions: The default permission mode new sessions start in. Changes apply to sessions opened afterwards.
# Allowed: workspace or full. Only in the system config or personal settings. Applies to new sessions.
level = "workspace"

# Start new sessions read-only: When on, new sessions begin read-only. The AI can look around and plan, and you turn read-only off when files should change. A project config can only turn it on.
# Allowed: true or false. Only in the system config, personal settings or a project config. Applies to new sessions.
start_read_only = false

[persona]
# Default persona: The persona new sessions use. When unset, new sessions have no persona: no character prompt, and a memory of their own.
# Allowed: a name starting with a lowercase letter, using only lowercase letters, digits, - and _, up to 64 characters. Only in the system config or personal settings. Applies to new sessions.
# default =

[pools."<id>"]
# Description for the model: One line the AI sees after the pool name when it starts a subagent. Write it in English.
# Allowed: one line of English, at most 60 characters. Only in the system config or personal settings. Applies to new sessions.
# description =

# Pool members: A group of models, each written as provider/model.
# Allowed: a list of <provider>/<model>. Only in the system config or personal settings. Takes effect next turn.
# models =

# Pool strategy: Keep a session on one member, or take the next member for every request. Left out, a pool whose members are all billed per request rotates and the others pin.
# Allowed: pin or rotate. Only in the system config or personal settings. Takes effect next turn.
# strategy =

# Subagents can pick it: When on, the AI can pick this pool for a subagent in new sessions. It is listed only once it has members.
# Allowed: true or false. Only in the system config or personal settings. Applies to new sessions.
subagent = false

[pools.flagship]
# Subagents can pick it: When on, the AI can pick this pool for a subagent in new sessions. It is listed only once it has members.
# Allowed: true or false. Only in the system config or personal settings. Applies to new sessions.
subagent = true

[pools.lite]
# Subagents can pick it: When on, the AI can pick this pool for a subagent in new sessions. It is listed only once it has members.
# Allowed: true or false. Only in the system config or personal settings. Applies to new sessions.
subagent = true

[pools.normal]
# Subagents can pick it: When on, the AI can pick this pool for a subagent in new sessions. It is listed only once it has members.
# Allowed: true or false. Only in the system config or personal settings. Applies to new sessions.
subagent = true

[preset]
# Default preset: The preset new sessions use.
# Allowed: a name starting with a lowercase letter, using only lowercase letters, digits, - and _, up to 64 characters. Only in the system config or personal settings. Applies to new sessions.
default = "full"

[profile]
# More about you: Anything you want the AI to know about you; can be left empty. Not included in group chats on messaging platforms.
# Allowed: text of at most 2000 characters; line breaks allowed. Only in personal settings. Applies to new sessions.
# about =

# What the AI calls you: How the AI addresses you, such as your name or a nickname.
# Allowed: text of at most 64 characters. Only in personal settings. Applies to new sessions.
# name =

# What language should the AI reply in: The language the AI replies in by default. You can ask it to switch at any time.
# Allowed: text of at most 64 characters. Only in personal settings. Applies to new sessions.
# preferred_reply_language =

[providers."<id>"]
# Address: The address of this provider's API; the driver adds the path. Known providers can leave it out.
# Allowed: an address starting with http:// or https:// or { env = "…" }. Only in the system config or personal settings. Takes effect next turn.
# base_url =

# Cache class: How this provider bills its cache. For now it only decides how a pool without a strategy splits. Left out, it follows the driver.
# Allowed: contract, best_effort or per_request. Only in the system config or personal settings. Takes effect next turn.
# cache =

# Catalog provider: Which provider in the model data this one is, for example deepseek for a relay that only forwards DeepSeek.
# Allowed: a name starting with a lowercase letter, using only lowercase letters, digits, - and _, up to 64 characters. Only in the system config or personal settings. Takes effect next turn.
# catalog =

# Driver: How to talk to this provider. Known providers can leave it out.
# Allowed: openai-chat, anthropic or openai-responses. Only in the system config or personal settings. Takes effect next turn.
# driver =

# Key: Write { secret = "name" } (saved with miyu provider login) or { env = "VARIABLE" }. One per provider; to use several quotas together, set up several providers and put them in a pool. Without one, no auth header is sent.
# Allowed: { secret = "…" } or { env = "…" }. Only in the system config or personal settings. Takes effect next turn.
# key =

# Local service: A model service on this machine, counted as free. Left out, it follows the address: on this machine means yes.
# Allowed: true or false. Only in the system config or personal settings. Takes effect next turn.
# local =

# Display name: The name people see. The id is only for referring to models; without one, the model data's name for this provider is used, then the id.
# Allowed: text of at most 64 characters. Only in the system config or personal settings. Takes effect immediately.
# name =

# Price multiplier: Prices of this provider are multiplied by it. 1 if left out. A multiplier on the model wins.
# Allowed: a number from 0 to 1000. Only in the system config or personal settings. Takes effect next turn.
# price_multiplier =

[providers."<id>".compat]
# Constrained decoding: This provider writes only what the parameter schema allows, so a tool shown with an empty schema gets {}. When on, tools that need loading are sent to it in full. Left out, it follows the profile.
# Allowed: true or false. Only in the system config or personal settings. Takes effect next turn.
# strict_tools =

[providers."<id>".models."<model>"]
# Catalog entry: Which models.dev entry to use: <provider>/<model>. Left out, it is found by name.
# Allowed: text of at most 256 characters. Only in the system config or personal settings. Takes effect next turn.
# catalog =

# Default reasoning effort: The reasoning effort this model uses by default: one of its levels, for example high, or off where thinking can be turned off. Left out, the provider decides.
# Allowed: text of at most 32 characters. Only in the system config or personal settings. Takes effect next turn.
# effort =

# Inputs: What this model can read: text, images, PDF, audio, video.
# Allowed: a list of text, image, pdf, audio or video. Only in the system config or personal settings. Takes effect next turn.
# inputs =

# Max output: How many tokens this model can write at most in one reply.
# Allowed: a whole number from 1 to 100000000. Only in the system config or personal settings. Takes effect next turn.
# max_output =

# Price multiplier: Prices of this model are multiplied by it, over the one on the provider.
# Allowed: a number from 0 to 1000. Only in the system config or personal settings. Takes effect next turn.
# price_multiplier =

# Reasoning levels: Which reasoning levels this model offers.
# Allowed: a list of text of at most 32 characters. Only in the system config or personal settings. Takes effect next turn.
# reasoning =

# Default temperature: The temperature this model uses by default, from 0 to 2; higher gives looser answers. Left out, the provider decides. Not sent to models that do not take one.
# Allowed: a number from 0 to 2. Only in the system config or personal settings. Takes effect next turn.
# temperature =

# Tool calls: Whether this model can call tools.
# Allowed: true or false. Only in the system config or personal settings. Takes effect next turn.
# tools =

# Context window: The context window of this model, in tokens.
# Allowed: a whole number from 1 to 100000000. Only in the system config or personal settings. Takes effect next turn.
# window =

[providers."<id>".models."<model>".price]
# Cache read price: Price per million tokens read from the cache.
# Allowed: a number from 0 to 1000000. Only in the system config or personal settings. Takes effect next turn.
# cache_read =

# Cache write price: Price per million tokens written to the cache.
# Allowed: a number from 0 to 1000000. Only in the system config or personal settings. Takes effect next turn.
# cache_write =

# Currency: Currency of the price, three capital letters such as USD or CNY. USD if left out.
# Allowed: text of at most 3 characters. Only in the system config or personal settings. Takes effect next turn.
# currency =

# Input price: Price per million input tokens. A written price is used whole.
# Allowed: a number from 0 to 1000000. Only in the system config or personal settings. Takes effect next turn.
# input =

# Output price: Price per million output tokens.
# Allowed: a number from 0 to 1000000. Only in the system config or personal settings. Takes effect next turn.
# output =

[sandbox]
# Sandbox strength: Auto uses BubbleWrap by default and falls back to Landlock when it isn't installed or can't run.
# Allowed: auto or weak. Only in the system config or personal settings. Takes effect next turn.
strength = "auto"

[sandbox.private]
# Added private folders: Folders commands can't read or write and file tools ask about first.
# Allowed: a list of text of at most 4096 characters. Only in the system config or personal settings. Takes effect next turn.
# add =

# Private folders: When off, neither the default nor the added private folders are hidden and file tools stop asking; Miyu's own data stays hidden.
# Allowed: true or false. Only in the system config or personal settings. Takes effect next turn.
enabled = true

# Default private folders: Folders hidden out of the box. The ones kept stay private; for the ones taken out, commands can read them and file tools stop asking. Restoring the default brings them all back.
# Allowed: a list of text of at most 4096 characters. Only in the system config or personal settings. Takes effect next turn.
# remove =

[sandbox.readonly]
# Added protected paths: Files and folders file tools ask about before changing; reading is unaffected. Write ~/…, an absolute path, or a path inside the workspace such as .vscode (any level counts).
# Allowed: a list of text of at most 4096 characters. Only in the system config or personal settings. Takes effect next turn.
# add =

# Protected paths: When off, neither the default nor the added protected paths apply, and file tools stop asking before changing them; Miyu's own data stays protected.
# Allowed: true or false. Only in the system config or personal settings. Takes effect next turn.
enabled = true

# Default protected paths: Protected out of the box: .git/hooks, editor and agent settings in the workspace, shell startup files in your home folder, and so on. The ones kept stay protected; for the ones taken out, file tools stop asking. Restoring the default brings them all back.
# Allowed: a list of text of at most 4096 characters. Only in the system config or personal settings. Takes effect next turn.
# remove =

[sandbox.tools]
# No sandbox: this tool: The admin lets this tool run outside the sandbox (scripts that touch hardware or need root). The value is where the tool comes from: ~home for your own scripts, the package's id for installed packages, basesystem for the built-in shell; a mismatch doesn't count. A granted tool runs outside the sandbox without asking in the admin's own sessions; group chats and strangers' private chats are still refused, and so is read-only.
# Allowed: text of at most 200 characters. Only in the system config. Takes effect next turn.
# "<name>" =

[terminal]
# New session after idle: After this many minutes without a message, the next one starts a new shell integration session; the old one is kept. 0 never starts a new one.
# Allowed: a whole number from 0 to 525600. Only in the system config or personal settings. Takes effect immediately.
idle_new_after = 180

# Shell integration session persona: The persona for a new shell integration session. Unset follows the default persona. A shell integration session in use keeps its own.
# Allowed: a name starting with a lowercase letter, using only lowercase letters, digits, - and _, up to 64 characters. Only in the system config or personal settings. Applies to new sessions.
# persona =

# Shell integration session preset: The preset for a new shell integration session. Unset follows the default preset.
# Allowed: a name starting with a lowercase letter, using only lowercase letters, digits, - and _, up to 64 characters. Only in the system config or personal settings. Applies to new sessions.
# preset =

[ui]
# Default interface: The interface plain miyu opens.
# Allowed: a name starting with a lowercase letter, using only lowercase letters, digits, - and _, up to 64 characters. Only in the system config or personal settings. Takes effect after restart.
head = "tui"

# Interface language: The language terminals, the web page and the command line use for you. auto follows the terminal or browser.
# Allowed: auto, zh, en or ja. Only in the system config or personal settings. Takes effect immediately.
language = "auto"

# On start, open: Whether a terminal interface or the web page opens a new session or picks up the most recent one.
# Allowed: new or recent. Only in the system config or personal settings. Takes effect after restart.
startup = "new"

# First-run guide done: This account has finished the first-run guide; the terminal and web pages no longer open it.
# Allowed: true or false. Only in personal settings. Takes effect immediately.
welcomed = false

[usage]
# Currency shown first: Amounts are added up per currency, never converted. This one is listed first, the others by code. Three capital letters such as USD or CNY.
# Allowed: text of at most 3 characters. Only in the system config or personal settings. Takes effect immediately.
currency = "USD"
