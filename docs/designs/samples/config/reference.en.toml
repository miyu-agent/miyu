# Every Miyu setting and its default. This file is generated. Editing it has no effect.
# Write the config in config.toml in the data root.

[clicall.mcp]
# Callable from scripts: this MCP server's tools: When on, all of this server's tools can be called with miyu call; when off, only directly. A tool with its own setting follows that one.
# Allowed: true or false. Only in the system config. Takes effect next turn.
# "<id>" =

[clicall.tools]
# Callable from scripts: When on, the AI can also call this tool with miyu call inside a command, and the result goes to the script; when off, it can only be called directly. Unset follows how it was registered (MCP servers and script tools are callable, among built-in tools only search, fetching pages, memory search and the knowledge base tools are, extension tools are not). Tools that write or send messages stay uncallable even when on.
# Allowed: true or false. Only in the system config. Takes effect next turn.
# "<name>" =

[commands."<id>"]
# Who can use this command: Who can use this slash command: you and group admins, anyone in the chat, or off for no one. When unset, the command's own setting applies, otherwise you and group admins.
# Allowed: admin, anyone or off. Only in the system config. Takes effect immediately.
# access =

[compaction]
# Compaction line: Compact automatically once the context fills this percent of the window. Small windows keep room for the reply, so compaction may start earlier. With a 200K window, values above 85 have no effect. A 1M window can reach 95.
# Allowed: a whole number from 20 to 95. Only in the system config. Takes effect next turn.
line = 85

# Prepare compaction early: When the context is nearly full, the older part is summarized in the background, so the switch happens without a wait when compaction is due. Off means compacting only once the limit is reached, as before.
# Allowed: true or false. Only in the system config. Takes effect next turn.
prepare = true

[core]
# Core idle exit: Minutes with no connection and no running turn before the core exits. 0 keeps it running (the default); a head starts the core again when it can't reach it.
# Allowed: a whole number from 0 to 525600. Only in the system config. Takes effect immediately.
idle_exit = 0

# Core worker threads: How many threads the core uses for connections, sessions and requests. 0 follows the CPU core count (the default); 1 counts as 2.
# Allowed: a whole number from 0 to 64. Only in the system config. Takes effect after the core restarts.
workers = 0

[external.bindings]
# My platform accounts: Which platform identities are you. The key is the platform identity (for example qq:10001), the value is owner. In private chats that identity is you.
# Allowed: a name starting with a lowercase letter, using only lowercase letters, digits, - and _, up to 64 characters. Only in the system config. Takes effect immediately.
# "<external>" =

[features]
# Turn this skill, script or MCP server on: Presets that turn on what they don't list follow this switch for the skill, script or MCP server, except where a preset turns it on or off itself. Presets that leave unlisted features off ignore it.
# Allowed: true or false. Only in the system config. Takes effect next turn.
# "<name>" =

[jobs]
# Longest background command: A command the AI runs in the background is stopped after this long, and the AI is told. At most 2 hours.
# Allowed: a length of time from 1m to 2h, written like 30s, 10m or 1h. Only in the system config. Takes effect next turn.
max_running = "30m"

[log]
# Runtime log level: How much the runtime log records. Set debug when chasing a problem. MIYU_LOG, when set, wins for that launch.
# Allowed: error, warn, info, debug, trace or off. Only in the system config. Takes effect immediately.
level = "info"

[memory]
# Consolidation runs to keep: Keep only this many of the latest consolidation runs for each memory. Older ones go to the trash. 0 deletes each run when it ends.
# Allowed: a whole number from 0 to 1000. Only in the system config. Takes effect next turn.
dream_keep = 20

# Wait before organizing memories: Once the conversation has been quiet this long, the AI turns what is worth keeping from the new part into memories.
# Allowed: a length of time from 1m to 1h, written like 30s, 10m or 1h. Only in the system config. Takes effect next turn.
extract_idle = "30m"

# Turns before organizing a busy chat: When a chat never goes quiet, the AI organizes in the background once this many turns have passed since the last time, without waiting for a pause.
# Allowed: a whole number from 2 to 500. Only in the system config. Takes effect next turn.
extract_max_turns = 20

# Longest wait in a busy chat: When a chat never goes quiet, the AI organizes in the background once the earliest unorganized turn is this old, without waiting for a pause.
# Allowed: a length of time from 10m to 24h, written like 30s, 10m or 1h. Only in the system config. Takes effect next turn.
extract_max_wait = "1h"

# Turns before organizing: The AI organizes only after at least this many turns since the last time.
# Allowed: a whole number from 1 to 100. Only in the system config. Takes effect next turn.
extract_turns = 2

# How often to consolidate memories: After this long the AI goes over new and older memories together: drops repeats and outdated ones, and writes a summary of what it knows about you.
# Allowed: a length of time from 1h to 720h, written like 30s, 10m or 1h. Only in the system config. Takes effect next turn.
merge_every = "16h"

[models]
# Chat model: The model new sessions use, written as provider/model, for example deepseek/deepseek-flash, or @pool.
# Allowed: <provider>/<model> or @<pool>. Only in the system config. Applies to new sessions.
# chat =

# Semantic model: Improves search quality for memories, knowledge bases and more.
# Allowed: local, off or <provider>/<model>. Only in the system config. Takes effect next turn.
# embedding =

# Vision model: Looks at images for the chat model when it cannot. Written like the chat model.
# Allowed: <provider>/<model> or @<pool>. Only in the system config. Takes effect next turn.
# vision =

[models.catalog]
# Update every: Fetch again once the cached catalog is this old.
# Allowed: a length of time from 1h to 720h, written like 30s, 10m or 1h. Only in the system config. Takes effect immediately.
every = "24h"

# Update the catalog: Fetch a newer model catalog from models.dev in the background. Off uses only the bundled and already fetched ones.
# Allowed: true or false. Only in the system config. Takes effect immediately.
update = true

# Catalog address: Where to fetch the model catalog from.
# Allowed: an address starting with http:// or https:// or { env = "…" }. Only in the system config. Takes effect immediately.
url = "https://models.dev/api.json"

[models.cooldown.auth]
# Auth failure pause: How long a pool model rests the first time it fails to authenticate. It doubles each time in a row.
# Allowed: a length of time from 1s to 1h, written like 30s, 10m or 1h. Only in the system config. Takes effect immediately.
base = "10m"

# Auth failure pause cap: The auth failure pause stops doubling here.
# Allowed: a length of time from 1s to 24h, written like 30s, 10m or 1h. Only in the system config. Takes effect immediately.
max = "2h"

[models.cooldown.quota]
# Out-of-quota pause: How long a pool model rests the first time it runs out of quota or credit and the provider doesn't say when it comes back. When it does say, that time is used, up to a day.
# Allowed: a length of time from 1s to 24h, written like 30s, 10m or 1h. Only in the system config. Takes effect immediately.
base = "30m"

# Out-of-quota pause cap: Without a stated reset time, the pause doubles each time in a row up to this.
# Allowed: a length of time from 1s to 24h, written like 30s, 10m or 1h. Only in the system config. Takes effect immediately.
max = "30m"

[models.cooldown.rate_limited]
# Rate limit cooldown: How long an endpoint rests the first time it is rate limited. It doubles each time in a row.
# Allowed: a length of time from 1s to 1h, written like 30s, 10m or 1h. Only in the system config. Takes effect immediately.
base = "30s"

# Rate limit cooldown cap: The rate limit cooldown stops doubling here, even when the provider asks for longer.
# Allowed: a length of time from 1s to 24h, written like 30s, 10m or 1h. Only in the system config. Takes effect immediately.
max = "10m"

[models.cooldown.retryable]
# Error cooldown: How long an endpoint rests the first time it cannot be reached or fails on its side. It doubles each time in a row.
# Allowed: a length of time from 1s to 1h, written like 30s, 10m or 1h. Only in the system config. Takes effect immediately.
base = "10s"

# Error cooldown cap: The cooldown for these errors stops doubling here.
# Allowed: a length of time from 1s to 24h, written like 30s, 10m or 1h. Only in the system config. Takes effect immediately.
max = "5m"

[net]
# Internal domains: Domains the AI never visits on behalf of others (people in group chats, strangers), subdomains included, whatever they resolve to and whether or not a proxy is used; you are not affected. For example example-corp.com.
# Allowed: a list of text of at most 253 characters. Only in the system config. Takes effect next turn.
# internal_domains =

[net.search]
# Web provider: Which service AI uses to search and fetch the web. Auto sticks to free tiers: searches try Exa, Parallel, Firecrawl, AnySearch and You.com in turn and rest any that hit a rate limit, and pages that can't be fetched directly are fetched by Exa, Firecrawl or Parallel. These services are outside China and receive the search terms and addresses. A chosen one is tried first (DeepSeek also fetches pages before AI tries them itself), and Auto takes over when it fails.
# Allowed: auto, deepseek, tavily, brave or searxng. Only in the system config. Takes effect next turn.
source = "auto"

[net.search.brave]
# Brave Search: Needed when Brave is the web provider.
# Allowed: { secret = "…" } or { env = "…" }. Only in the system config. Takes effect next turn.
# key =

[net.search.deepseek]
# DeepSeek: Needed when DeepSeek is the web provider; if unset, the key of your DeepSeek model provider is used. Searches and fetched pages are charged per use.
# Allowed: { secret = "…" } or { env = "…" }. Only in the system config. Takes effect next turn.
# key =

[net.search.exa]
# Exa: With a key, searches use your own Exa quota; without one, the free quota.
# Allowed: { secret = "…" } or { env = "…" }. Only in the system config. Takes effect next turn.
# key =

[net.search.searxng]
# SearXNG address: Your own SearXNG instance, for example http://127.0.0.1:8888, with the JSON format enabled. Used when SearXNG is the web provider.
# Allowed: an address starting with http:// or https:// or { env = "…" }. Only in the system config. Takes effect next turn.
# url =

[net.search.tavily]
# Tavily: Needed when Tavily is the web provider.
# Allowed: { secret = "…" } or { env = "…" }. Only in the system config. Takes effect next turn.
# key =

[packages]
# Held packages: Packages (by id) skipped when upgrading; the installed version stays.
# Allowed: a list of text of at most 64 characters. Only in the system config. Takes effect immediately.
# hold =

# Mirrors: Tried in order before the source when it is slow or unreachable. Content is still checked against the signature and hashes, so a mirror can't change it.
# Allowed: a list of an address starting with http:// or https:// or { env = "…" }. Only in the system config. Takes effect immediately.
mirrors = []

# Package source address: Where to look up and download packages. The official source by default; any other address must serve content signed by the official key.
# Allowed: an address starting with http:// or https:// or { env = "…" }. Only in the system config. Takes effect immediately.
source = "https://miyu-agent.github.io/packages/"

