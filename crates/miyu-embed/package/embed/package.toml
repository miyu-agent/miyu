# 内置语义模型（施工 R-5 三补，设计 30 第六节；R-5 七补换成 granite-embedding-97m-multilingual-r2）：小程序包，出厂不装；包文件夹
# 里放 model.toml 和它写的三个模型文件，miyu-embed 放在包文件夹的 bin/ 或 miyu 旁边。人格记忆的清单推荐它（[recommends] workers = ["embed"]）。给人看的字，
# 不发给模型。
[package]
protocol = [1, 1]
name = { en = "Built-in semantic model", zh = "内置语义模型", ja = "内蔵の意味モデル" }
summary = { en = "Search memories by meaning on this machine, no network needed", zh = "在本机照意思找记忆，不用联网", ja = "この機械の上で記憶を意味で探します。ネットは要りません" }

[worker]
program = "miyu-embed"
