# 内置语义模型的模型清单（施工 R-5 三补；R-5 七补换模型，`docs/blueprint/recall.md` 第四条第 2 款）：granite-embedding-97m-multilingual-r2
# 的 4 位量化 ONNX（`tools/quantize_q4.py` 从官方 revision 835ad140 的 fp32 量化），Apache-2.0，384 维，取第一个词那一格；分词是字节级
# BPE（`tools/bpe_files.py` 从官方的 tokenizer.json 转）。做包时和三个模型文件一起放进包文件夹，核心第一次用时照这里核对大小、
# SHA-256；文件从 Miyu 的 GitHub Release `models-granite-embedding-97m-multilingual-r2` 取（`SHA256SUMS` 照这里写的，许可证和改了
# 什么在 `LICENSE`、`NOTICE`）。换模型就是换包。
id = "granite-embedding-97m-multilingual-r2"
dims = 384
pooling = "cls"
max_tokens = 512

[tokenizer]
kind = "bpe"
start = "<|startoftext|>"
end = "<|return|>"

