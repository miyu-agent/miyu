[package]
name = "miyu-http"
description = "HTTP 执行器：照驱动编码好的字节发请求，流式读回来交给解码器"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
miyu-drivers = { path = "../miyu-drivers" }
miyu-kernel = { path = "../miyu-kernel" }
# 理由见 docs/construction/3-5-发请求与读流（上）.md「我定的」：异步里流式读取、超时、打断最顺；
# TLS 用 rustls，证书认系统的和 webpki 自带的两份，不依赖 OpenSSL。
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
# `rt`、`sync`（施工 V-38）：请求体里的 blob 在阻塞线程里读、编好一块经通道交过来一块。整个工作区本来就开着这两样。
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
# 请求体边编边发（施工 V-38）：自己的流交给 reqwest 要照 `http-body` 的接口，一块块是 `bytes` 的共享缓冲（编好的字交出去
# 不拷）；对方没处理就拒了要认 `h2` 的错（`REFUSED_STREAM`、`GOAWAY`），照 reqwest 原来的条件重发。三个都是 reqwest
# 本来就带进来的同一版，没有新包。MIT。
bytes = "1"
http-body = "1"
h2 = "0.4"
# 这一跳走不走代理（施工 U23 下下从 miyu-net 挪下来的 `proxy.rs`）：reqwest 自己照环境变量走代理用的就是它的 `Matcher`，
# `NO_PROXY` 的读法和请求模型一字不差。本来就在依赖图里（reqwest 带进来的）。MIT。
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy"] }
# `Matcher` 收的地址是 `http::Uri`。本来就在依赖图里。MIT 或 Apache-2.0。
http = "1"
# 整个进程共用一份 TLS 配置（施工 V-5 上）：照 reqwest 自己的拼法，证书只读一次。三个都是 reqwest 本来就带进来的同一版、
# 同一套功能，没有新包。
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
# 运行日志的门面（施工 3-7 上）：只发，不管写成什么样、写到哪，那是 miyu-log 的事。
tracing = { version = "0.1", default-features = false, features = ["std"] }

[features]
# 测试用的假服务器（`src/testkit.rs`，施工 3-7 下）：别的 crate 的测试要用它，在自己的 dev-dependencies
# 里打开；这个包自己的测试也经下面那一行打开。
testkit = ["tokio/io-util", "tokio/net", "tokio/rt", "tokio/sync"]

[dev-dependencies]
# 自己的集成测试用上假服务器。
miyu-http = { path = ".", features = ["testkit"] }
# 测试里接住发出来的日志，查写了什么、没写什么。
miyu-log = { path = "../miyu-log" }
# 测试跑在 tokio 上；请求体的量尺（施工 PF-1）照核心用多线程的运行时。
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true

# 集成测试并成一个程序（施工 0-3 三补）；自己装日志订阅者的另列。
[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "log"
path = "tests/log.rs"
