[package]
name = "miyu-source"
description = "软件源：包文件的打包、解包（施工 G-1），之后是索引、签名、下载（设计 37-软件源.md）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
miyu-config = { path = "../miyu-config" }
# 包文件是 zstd 压的 tar（设计 31 第八节第 1 条）。tar 是纯 Rust 的，MIT 或 Apache-2.0；zstd 和 reqwest 带进来的是同一版，
# MIT（底下的 libzstd 是 BSD）。
tar = { version = "0.4", default-features = false }
zstd = { version = "0.14", default-features = false }
sha2 = { version = "0.11", default-features = false }
# 索引的签名（设计 37 第三节第 2 条）：Ed25519 用 rustls 已经带进来的 ring，不另加密码库；Apache-2.0 和 ISC。
ring = "0.17"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jiff = "0.2"
# 收录读 sources.toml 这几份规则（施工 G-2 下）。
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
# 收录的小程序下 Release、包文件（施工 G-2 下）；之后客户端拿索引、下包也用它。
miyu-http = { path = "../miyu-http" }
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["rt"] }

[lints]
workspace = true
