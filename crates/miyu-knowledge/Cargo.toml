[package]
name = "miyu-knowledge"
description = "知识库这个软件包：她用来查知识库的两件工具（施工 K-1 下，docs/blueprint/knowledge.md）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
# 工具的结果、给人看的说法。
miyu-kernel = { path = "../miyu-kernel" }
# 工具的接口、读字、知识库的端口。
miyu-tool = { path = "../miyu-tool" }
# 她给的参数。
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# 测试里跑工具的 future。
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true

# 集成测试并成一个程序（施工 0-3 三补）。
[[test]]
name = "all"
path = "tests/all.rs"
