[package]
name = "miyu-client"
description = "给界面和扩展用的门面：连核心、找数据根、协议里的类型、给人看的字、读自己的清单、运行日志、进程的堆（设计 32 第二节，施工 S-1）；编号和时间、事件、工具的字、配置的读法、HTTP 客户端（设计 32 第九节，施工 S-6 上）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# 界面的测试照钉住的那份核心检出读资源目录、协议样本（`WORKSPACE_ROOT`）。
testkit = []
# 工具的字怎么读（`tooltext`）、HTTP 客户端（`http`）只有接入QQ 用：放在 feature 后面，默认不开。界面不开就不拉 reqwest、
# rustls、ring、沙盒那一套（网页 2026-10-16 量过：多 81 个 crate、release 程序大 351 KB）。
tool = ["dep:miyu-tool"]
http = ["dep:miyu-http"]
# 找桌面壁纸、换了跟着变（施工 X-29，「跟随壁纸」的主题用）：只有头要，默认不开。
wallpaper = ["dep:miyu-wallpaper"]
# 视图流的条目、推送、会话状态读回来的类型（施工 V-D，终端换成照视图流画要的）：只有头要，默认不开。
view = ["dep:miyu-view"]

[dependencies]
# 下面这几个都是转出去的：界面只经这里拿，代码留在原处（设计 32 第二节第 1 条）。
miyu-ipc = { path = "../miyu-ipc" }
miyu-store = { path = "../miyu-store" }
miyu-kernel = { path = "../miyu-kernel" }
miyu-config = { path = "../miyu-config" }
miyu-log = { path = "../miyu-log" }
miyu-seeds = { path = "../miyu-seeds" }
miyu-heap = { path = "../miyu-heap" }
# 工具的字怎么读、HTTP 客户端：接入QQ 只依赖门面以后经这里拿（设计 32 第九节第 1 条，施工 S-6 上）。
miyu-tool = { path = "../miyu-tool", optional = true }
miyu-http = { path = "../miyu-http", optional = true }
# 找桌面壁纸（施工 X-29，从网页仓库搬来）。
miyu-wallpaper = { path = "../miyu-wallpaper", optional = true }
# 视图投影的类型（施工 V-D）。
miyu-view = { path = "../miyu-view", optional = true }
# `open`：照终端的样子连核心、一问一答（从 miyu-webserve 挪来，施工 S-1）。
serde_json = "1.0"
tokio = { version = "1", features = ["io-util", "time"] }

[dev-dependencies]
# 门面测试读自己的清单，查两组重的依赖默认不开；同 miyu-config 用的那一份。
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
# 测试、clippy 照打开两组重的编：核心仓库里没有别的 crate 打开它们了（接入QQ 施工 S-6 下搬走），不这样它们在核心的门禁、
# CI 里一次都不编、不测。只管测试的那一份，界面照旧默认不开。
miyu-client = { path = ".", features = ["tool", "http", "wallpaper", "view"] }

[lints]
workspace = true
