[package]
name = "miyu-heap"
description = "进程的堆：glibc 上限制 arena 的个数、空闲时把空着的还给系统（23 F3，施工 V-2 再补）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Cargo 不许 `workspace = true` 以后再单改一条：这里照抄工作区的（改那边的，记得同步这里），只把 `unsafe_code` 从
# `forbid` 改成 `deny`：整个 crate 仍然不许，只有调 glibc 的两处单独放开，写明为什么安全（同 `miyu-sandbox`）。
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[lints.clippy]
let_underscore_must_use = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# Linux 上关掉这个进程的透明大页（施工 YC-12，`lib.rs` 的 `tune`）：`prctl` 的安全封装，不用自己写 unsafe。MIT OR Apache-2.0，
# 工作区里本来就有。
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["thread"] }

# macOS 上问内核自己占了多少内存（施工 V-4 补，`usage.rs`）：`proc_pid_rusage`；还剩多少可用内存（施工 MEM-1，`room/macos.rs`）：
# `sysctlbyname`。
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Windows 上还剩多少可用内存（施工 MEM-1，`room/windows.rs`）：`GlobalMemoryStatusEx`。MIT OR Apache-2.0，工作区里本来就有。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }
