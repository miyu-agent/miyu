[package]
name = "miyu-endpoint"
description = "协议端点：连接上的 JSON-RPC，握手、造会话、说话、打断，会话表（施工 3-8 上）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

# 测试用的扩展（施工 9-4 上）：端点的测试把它当成 `process` 包的程序让核心拉起，三个平台都能真跑。不随发行带出去。
[[bin]]
name = "miyu-test-extension"
path = "src/bin/miyu-test-extension.rs"
test = false
doc = false

# 测试用的 MCP 服务（施工 X-3 上）：端点的测试把它写进 `bundle` 包的 `[[mcp]]`，让核心真起一个进程说 MCP。不随发行带出去。
[[bin]]
name = "miyu-test-mcp"
path = "src/bin/miyu-test-mcp.rs"
test = false
doc = false

[features]
# 测试用的口子（施工 U23 下下）：个人层软件源的地址闸照给的 `miyu_http::guard::Testing` 走（回环当公网），本机的假软件源连得上。
# 只在测试里打开：这个包自己的测试经 dev-dependencies 里那一行打开，生产的构建里没有这段代码。施工 TMP-1 补3 起还交出核心的
# 记忆（`Core::memory`），上层的测试照它让记忆的读慢下来。
testkit = ["miyu-http/testkit", "miyu-session/testkit"]

[dependencies]
# 时区：核心所在的机器现在的偏移，写进会话的环境。
jiff = "0.2"
# 定时任务的 cron（施工 J-1 上）：标准五段写法，照本机时区算下一次，夏令时照 OCPS 规范；直接认 jiff 的时刻，不带 chrono。
croner = { version = "4.0.1", default-features = false, features = ["jiff"] }
# 本机的监听器：一个个接连接（施工 3-8 下）。
miyu-ipc = { path = "../miyu-ipc" }
# 编号、命令、拒绝的原因。
miyu-kernel = { path = "../miyu-kernel" }
# 配置项 `ui.language` 照配置清单声明（施工 8-1）；读配置、合最终值、说清哪里写错了（施工 8-2）。
miyu-config = { path = "../miyu-config" }
# 读项目配置的信任记录 `trust.toml`（施工 8-2）：和配置清单读配置用的是同一个。
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
# 判官看的群聊记录（施工 O-24）：照会话的快照渲染一行一条，和她看到的同一个渲染器。
miyu-assemble = { path = "../miyu-assemble" }
# 模型这一块：`model.list` 照它算资料、来源（施工 8-7）。
miyu-models = { path = "../miyu-models" }
# 记忆的范围（施工 R-3 下）：`session.create` 的 `memory` 照它读；测试里读会话的策略快照。
miyu-policy = { path = "../miyu-policy" }
# `memory.*`（施工 R-3 补）：四类、编号、底账里的一条；测试里只读地搜回合库，照它的写法拼查询（施工 R-2 上）。
miyu-recall = { path = "../miyu-recall" }
# 会话 actor：造会话、载入、发命令（施工 3-7）。
miyu-session = { path = "../miyu-session" }
# 这台机器上的沙盒能不能用：握手时报给头，能用的把助手交给会话（施工 5-4 下）。
miyu-sandbox = { path = "../miyu-sandbox" }
# 数据根、资源目录、会话日志打不开的几种情形。
miyu-store = { path = "../miyu-store" }
miyu-source = { path = "../miyu-source" }
miyu-http = { path = "../miyu-http" }
reqwest = { version = "0.12", default-features = false }
sha2 = { version = "0.11", default-features = false }
# 工具目录：造会话时交给它，照它存下工具面（施工 4-1）。
miyu-tool = { path = "../miyu-tool" }
# MCP 的客户端（施工 X-3 上）：起 `bundle` 包带的服务，认时代、列工具、调工具。
miyu-mcp = { path = "../miyu-mcp" }
# 视图投影（施工 9-8 中）：`view.page` 照它把一页日志算成条目。
miyu-view = { path = "../miyu-view" }
# 人格头像的候选主色（施工 P-6 补，`persona.list`、`persona.get` 的 `seeds`）：和两个头算壁纸的同一份。
miyu-seeds = { path = "../miyu-seeds" }
# 头报来的工作目录太不太宽（施工 4-3 下）。
miyu-fs = { path = "../miyu-fs" }
# 附件（施工 3-9 三补）：blob.put 传来的内容是 base64；和基础系统用的是同一个。
base64 = "0.22"
# 分块上传的编号：16 位小写十六进制（施工 W-5）；和本机令牌用的是同一份。
getrandom = { version = "0.4", features = ["std"] }
# 协议是 JSON-RPC 2.0（04-核心协议.md P1）。
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 连接是异步的字节流：一行一条消息。接不了连接时歇一会儿再接。拉起扩展、经它的标准输入输出说协议（施工 9-4 上）。
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
# 运行日志的门面（施工 3-7 上）。
tracing = { version = "0.1", default-features = false, features = ["std"] }
# 撤销时之后又被改过的文件，算她改完的和现在的差异（施工 4-7 下）：Rust 里通用的那一个，只开文本。
similar = { version = "2", default-features = false, features = ["text"] }

[dev-dependencies]
# 测试的临时目录删到一半撞上后台写入的，过一会儿再删（施工 TMP-1）。
miyu-store = { path = "../miyu-store", features = ["testkit"] }
# 测试里的假网址服务（施工 X-32 上）：照请求答的 Streamable HTTP MCP 服务。
miyu-mcp = { path = "../miyu-mcp", features = ["testkit"] }
# 网址的服务登录（施工 X-42 上）：读授权页网址里的几格。工作区里本来就有的那一份。
url = "2"
# 人格头像的候选主色（施工 P-6 补）：测试里画一张真的 PNG 当头像。
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# 撤销的回应（施工 4-7 下）：她用真的写文件的工具改过文件。
miyu-basesystem = { path = "../miyu-basesystem" }
# 测试用的假工具（施工 4-2）。
miyu-tool = { path = "../miyu-tool", features = ["testkit"] }
# 测试里的配置清单带上 `log.level`（施工 8-2）：和核心登记的一样。
miyu-log = { path = "../miyu-log" }
# 测试里的假服务器：`model.list` 带 `refresh` 去拉供应商的列表（施工 8-7）。
miyu-http = { path = "../miyu-http", features = ["testkit"] }
# 个人层软件源的地址闸照测试的口子走（施工 U23 下下）。
miyu-endpoint = { path = ".", features = ["testkit"] }
# 测试里请求模型照剧本回（施工 3-8 上）。
miyu-session = { path = "../miyu-session", features = ["testkit"] }
# 测试里弄坏会话列表的索引（施工 3-8 七补）、只读地看回合库（施工 R-2 上）：和 miyu-store 用的是同一个。
rusqlite = { version = "0.40", features = ["bundled"] }
# 测试里她照剧本调记忆的三件工具（施工 R-3 补）。
miyu-memory = { path = "../miyu-memory" }
# 测试里会话的工具面上有长期目标的工具（施工 X-8 下）。
miyu-goal = { path = "../miyu-goal" }
# 测试里她照剧本调知识库的工具（施工 K-2：会话里照意思找）。
miyu-knowledge = { path = "../miyu-knowledge" }
# 测试里她照剧本调定时、循环的工具（施工 J-2）。
miyu-schedule = { path = "../miyu-schedule" }
# 测试里的等待有时限。
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }

[lints]
workspace = true

# 集成测试并成一个程序（施工 0-3 三补）；自己装日志订阅者的另列。
[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "config_watch_log"
path = "tests/config_watch_log.rs"

[[test]]
name = "index_log"
path = "tests/index_log.rs"

[[test]]
name = "login_log"
path = "tests/login_log.rs"


[[test]]
name = "schedules_log"
path = "tests/schedules_log.rs"

[[test]]
name = "model_call_log"
path = "tests/model_call_log.rs"

[[test]]
name = "robust_methods"
path = "tests/robust_methods.rs"

[[test]]
name = "providers_log"
path = "tests/providers_log.rs"

[[test]]
name = "secrets_log"
path = "tests/secrets_log.rs"

# 网址的服务登录的运行日志（施工 X-42 上）：同 secrets_log，全局订阅者一个程序只装一次。
[[test]]
name = "oauth_log"
path = "tests/oauth_log.rs"
