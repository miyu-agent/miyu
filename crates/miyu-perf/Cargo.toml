[package]
name = "miyu-perf"
description = "量尺：拉起 release 构建的真 miyu，量启动、内存、长会话上的请求、追加并同步、二进制大小（施工 V-1）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "miyu-perf"
path = "src/main.rs"

[dependencies]
# 连核心：找套接字、读本机令牌、等核心放开数据根的锁。
miyu-ipc = { path = "../miyu-ipc" }
# 追加并同步在进程里量：会话日志的事件。
miyu-kernel = { path = "../miyu-kernel" }
# 沙盒数据根，会话的目录，会话日志。
miyu-store = { path = "../miyu-store" }
# 协议是一行一个 JSON；原始数据也写成 JSON。
serde_json = "1.0"
# 排函数那一场（施工 LW-1）假模型另开 HTTPS 的口：真用的人连供应商走 TLS、多半是 HTTP/2，不开就录不到那几路的函数。TLS 照
# miyu-http 那样用 rustls（ring），h2 的服务端用 h2，帧里的请求、回应是 http、bytes 的类型。几个都是核心本来就带进来的同一版，
# 没有新包。许可证是 MIT，或者 MIT、Apache-2.0（rustls 另可 ISC）任选。
bytes = "1"
h2 = "0.4"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false }
# 假模型服务和连核心都是异步的，跑在同一个进程里，时刻可以直接比。
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
