[package]
name = "miyu-basesystem"
description = "基础系统这个软件包：随发行附带、几乎每个预设都打开的几件工具（施工 4-4 起）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
# shell 在 Windows 上把命令编成 PowerShell 的 -EncodedCommand（施工 4-8）；每个平台都编，它的测试到处都跑。
base64 = "0.22"
# 找文件的模式照 ripgrep 的 --glob 那一套（施工 4-4 下）：ripgrep 的作者拆出来的库，三个平台一样（B9）。
globset = "0.4"
# 搜内容：正则、按行搜、二进制跳过、前后行；和 ripgrep 是同一套（施工 4-4 下）。
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
# 找文件、搜内容往下走目录：遵守 .gitignore、.ignore（施工 4-4 下）。
ignore = "0.4"
# 碰文件：换成真实的位置、安全地打开（施工 4-3 上）；走目录时认出数据根（施工 4-4 下）。
miyu-fs = { path = "../miyu-fs" }
# 输出里给她看的几句是模板；参数格式是原样的 JSON；访问类别。
miyu-kernel = { path = "../miyu-kernel" }
# 调用带了沙盒的，shell 经沙盒的助手起命令（施工 5-1）。
miyu-policy = { path = "../miyu-policy" }
miyu-sandbox = { path = "../miyu-sandbox" }
# 工具的接口。
miyu-tool = { path = "../miyu-tool" }
# 脚本照 `#!` 找解释器：和包里的程序共用一份（施工 X-34，`miyu_store::packages::launcher`）；测试里核对工具会说的每一种
# 中文、英文都换得出字（施工 4-5 上）。
miyu-store = { path = "../miyu-store" }
# 读说明和参数格式、读参数。
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 读文件在阻塞线程里做，不占着跑异步任务的线程。
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "time"] }
# edit 宽松那一层的 NFKC 规范化（施工 4-6 中）：Rust 里通用的那一个。
unicode-normalization = "0.1"
# 运行日志的门面：shell 收拾命令时出的岔子记一条（施工 4-8）。
tracing = { version = "0.1", default-features = false, features = ["std"] }

# 脚本调工具的令牌（施工 M-3）：系统给的随机字节。MIT OR Apache-2.0，工作区里本来就有。
getrandom = { version = "0.4", features = ["std"] }

[target.'cfg(windows)'.dependencies]
# 脚本调工具的命名管道（施工 M-3 下）：只开给本人的管道、问另一头的进程编号，同核心自己的管道。
miyu-pipe = { path = "../miyu-pipe" }

[target.'cfg(unix)'.dependencies]
# shell 超时、叫停时整组杀掉命令：kill(-pgid, SIGKILL) 的安全接口（施工 4-8）。
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
# 接住运行日志，看阻塞线程里发的行带没带会话编号（施工 4-9 再补四上）。
miyu-log = { path = "../miyu-log" }
# 测试里的调用在异步里跑。
tokio = { version = "1", features = ["macros", "rt", "time"] }
# 往下走目录照这一轮的配置挑私密目录（施工 5-15 下）：假的调用、配置的值。
miyu-tool = { path = "../miyu-tool", features = ["testkit"] }
miyu-config = { path = "../miyu-config" }
# 造一张真能解开的大图，看超了上限的缩到上限以内（施工 I-S）。
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true

# 集成测试并成一个程序（施工 0-3 三补）；自己装日志订阅者的另列。
[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "log"
path = "tests/log.rs"

# 量读一页用多少内存（2026-10-30 发布前测试，缺陷 E-3）：量的是整个进程的峰值常驻内存，自己一个程序。
[[test]]
name = "read_memory"
path = "tests/read_memory.rs"
